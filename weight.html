<script src="assets/sim.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const {SimPage, Quiz, esc, rnd, pick, dragOn} = Sim;

/* ============================ texts ============================ */
const T = {
 el: {
  h1: 'Weight & Balance', sub: 'Ροπές, κέντρο βάρους και αντιδράσεις στηρίξεων: σύρε τα φορτία και δες τι αλλάζει.',
  gMode: 'Προσομοίωση', gUnits: 'Μονάδες', modes: {cg: 'Φόρτωση αεροσκάφους', lever: 'Μοχλός', beam: 'Δοκός σε 2 στηρίξεις'},
  titles: {cg: 'Κέντρο βάρους (CG) αεροσκάφους', lever: 'Ισορροπία μοχλού', beam: 'Αντιδράσεις στηρίξεων'},
  calc: 'Υπολογισμός', ctl: 'Φορτία', reset: 'Επαναφορά',
  items: {empty: 'Κενό αεροσκάφος', front: 'Μπροστινά καθίσματα', rear: 'Πίσω καθίσματα', fuel: 'Καύσιμο', bag: 'Αποσκευές'},
  short: {empty: 'Κενό', front: 'Μπροστά', rear: 'Πίσω', fuel: 'Καύσιμο', bag: 'Αποσκευές'},
  cols: ['Στοιχείο', 'Βάρος', 'Βραχίονας', 'Ροπή'], total: 'Σύνολο',
  datum: 'datum', limits: 'όρια CG', cgAt: 'CG',
  ok: 'Μέσα στα όρια', fwd: 'CG μπροστά από το όριο (βαρύ ρύγχος)', aft: 'CG πίσω από το όριο (βαριά ουρά)', heavy: 'Πάνω από το μέγιστο βάρος απογείωσης',
  hintCg: 'Σύρε τα φορτία πάνω στο αεροσκάφος για να αλλάξεις βραχίονα, ή άλλαξε τα βάρη από τα ρυθμιστικά. Ο βραχίονας μετριέται από το datum (μύτη).',
  hintLever: 'Σύρε το υπομόχλιο (τρίγωνο) και τις δυνάμεις. Ροπή = δύναμη × απόσταση από το υπομόχλιο.',
  hintBeam: 'Σύρε τα φορτία πάνω στη δοκό. Παίρνουμε ροπές ως προς το Α για να βρούμε το R_B.',
  cw: 'δεξιόστροφη', acw: 'αριστερόστροφη', net: 'Συνισταμένη ροπή', balanced: 'Ισορροπεί', notBal: 'Δεν ισορροπεί: γέρνει',
  toCw: 'δεξιά', toAcw: 'αριστερά', pivot: 'υπομόχλιο', force: 'Δύναμη', pos: 'θέση', len: 'Μήκος δοκού',
  gal: 'gal', lit: 'L',
  foot: 'Ροπή = βάρος × βραχίονας. CG = ΣΡοπών / ΣΒαρών. Σε ισορροπία οι δεξιόστροφες ροπές ισούνται με τις αριστερόστροφες. Τα όρια και οι θέσεις είναι ενδεικτικά για ένα μικρό τετραθέσιο, όχι από εγχειρίδιο.'
 },
 en: {
  h1: 'Weight & Balance', sub: 'Moments, centre of gravity and support reactions: drag the loads and see what changes.',
  gMode: 'Simulation', gUnits: 'Units', modes: {cg: 'Aircraft loading', lever: 'Lever', beam: 'Beam on 2 supports'},
  titles: {cg: 'Aircraft centre of gravity (CG)', lever: 'Lever balance', beam: 'Support reactions'},
  calc: 'Calculation', ctl: 'Loads', reset: 'Reset',
  items: {empty: 'Empty aircraft', front: 'Front seats', rear: 'Rear seats', fuel: 'Fuel', bag: 'Baggage'},
  short: {empty: 'Empty', front: 'Front', rear: 'Rear', fuel: 'Fuel', bag: 'Baggage'},
  cols: ['Item', 'Weight', 'Arm', 'Moment'], total: 'Total',
  datum: 'datum', limits: 'CG limits', cgAt: 'CG',
  ok: 'Within limits', fwd: 'CG forward of the limit (nose heavy)', aft: 'CG aft of the limit (tail heavy)', heavy: 'Above the maximum take-off weight',
  hintCg: 'Drag the loads along the aircraft to change their arm, or change the weights with the sliders. Arms are measured from the datum (the nose).',
  hintLever: 'Drag the pivot (triangle) and the forces. Moment = force × distance from the pivot.',
  hintBeam: 'Drag the loads along the beam. Take moments about A to find R_B.',
  cw: 'clockwise', acw: 'anticlockwise', net: 'Net moment', balanced: 'Balanced', notBal: 'Not balanced: tips',
  toCw: 'right', toAcw: 'left', pivot: 'pivot', force: 'Force', pos: 'position', len: 'Beam length',
  gal: 'gal', lit: 'L',
  foot: 'Moment = weight × arm. CG = total moment / total weight. In balance the clockwise moments equal the anticlockwise ones. Limits and stations are illustrative for a small four-seater, not taken from a flight manual.'
 }
};
const page = new SimPage(T);
const t = () => page.t, f = (x, d) => page.fmt(x, d);

/* ============================ units ============================ */
const U = {
  imperial: {w: 'lb', a: 'in', m: 'in·lb', len: 'ft', F: 'lb', M: 'lb·ft', fuelPer: 6, fuelU: 'gal', wStep: 5, aStep: 1},
  SI:       {w: 'kg', a: 'm',  m: 'kg·m',  len: 'm',  F: 'N',  M: 'N·m',   fuelPer: 0.72, fuelU: 'L', wStep: 1, aStep: 0.01}
};
const LB = 0.4536, IN = 0.0254;

/* ============================ models ============================ */
class CGModel {
  constructor() { this.reset('imperial'); }
  // Stations (imperial) for an illustrative four-seater with the datum at the nose.
  static base() {
    return {items: [
      {id: 'empty', w: 1500, arm: 85, wmin: 1200, wmax: 1800},
      {id: 'front', w: 340, arm: 90, wmin: 0, wmax: 450},
      {id: 'rear',  w: 0,   arm: 125, wmin: 0, wmax: 450},
      {id: 'fuel',  w: 240, arm: 95, wmin: 0, wmax: 318},
      {id: 'bag',   w: 50,  arm: 150, wmin: 0, wmax: 120}],
      fwd: 82, aft: 95, mtow: 2400, len: 230};
  }
  reset(units) {
    const b = CGModel.base();
    if (units === 'SI') {
      b.items.forEach(i => { i.w = Math.round(i.w * LB); i.wmin = Math.round(i.wmin * LB); i.wmax = Math.round(i.wmax * LB); i.arm = Math.round(i.arm * IN * 100) / 100; });
      b.fwd = Math.round(b.fwd * IN * 100) / 100; b.aft = Math.round(b.aft * IN * 100) / 100; b.mtow = Math.round(b.mtow * LB); b.len = b.len * IN;
    }
    Object.assign(this, b);
  }
  get W() { return this.items.reduce((s, i) => s + i.w, 0); }
  get M() { return this.items.reduce((s, i) => s + i.w * i.arm, 0); }
  get cg() { return this.W ? this.M / this.W : 0; }
  status() {
    if (this.W > this.mtow) return 'heavy';
    if (this.cg < this.fwd - 1e-9) return 'fwd';
    if (this.cg > this.aft + 1e-9) return 'aft';
    return 'ok';
  }
}

class BeamModel {
  // Lever: forces act downward at x; pivot at p. Beam: supports at 0 and L.
  constructor() { this.reset(); }
  reset() { this.L = 10; this.p = 5; this.forces = [{F: 40, x: 2}, {F: 20, x: 9}]; }
  moments() {                                     // about the pivot: right of pivot = clockwise
    let cw = 0, acw = 0;
    this.forces.forEach(o => { const m = o.F * (o.x - this.p); if (m > 0) cw += m; else acw -= m; });
    return {cw, acw, net: cw - acw};
  }
  reactions() {                                   // supports A at 0, B at L
    const sumF = this.forces.reduce((s, o) => s + o.F, 0), mA = this.forces.reduce((s, o) => s + o.F * o.x, 0);
    const RB = mA / this.L; return {RA: sumF - RB, RB, mA, sumF};
  }
}

/* ============================ page ============================ */
class WeightPage {
  constructor() {
    this.mode = 'cg'; this.units = 'imperial';
    this.cg = new CGModel(); this.beam = new BeamModel();
    this.svg = $('view'); this.scene = $('scene');
    dragOn(this.svg, (k, p) => this.drag(k, p));
    page.bindLang($('lang-el'), $('lang-en'));
    page.onLang(() => this.renderAll());
    $('reset').onclick = () => { this.cg.reset(this.units); this.beam.reset(); this.renderAll(); };
    this.quiz = new Quiz(page, $('quiz'), QUIZ, {topics: ['torque'], tpls: ['cg.', 'torque.moment', 'torque.arm_from_moment', 'torque.force_from_moment',
      'torque.balance_distance', 'torque.balance_force', 'torque.net_moment', 'torque.beam_reaction', 'torque.couple']});
    const h = location.hash.slice(1); if (T.el.modes[h]) this.mode = h;
    this.renderAll(); this.quiz.next();
  }
  get u() { return U[this.units]; }

  setMode(m) { this.mode = m; try { history.replaceState(null, '', '#' + m); } catch (e) { /* file:// */ } this.renderAll(); }
  setUnits(u) {
    if (u === this.units) return;
    this.units = u; this.cg.reset(u); this.renderAll();
  }

  renderAll() {
    const L = t();
    document.title = L.h1;
    $('h1').textContent = L.h1; $('sub').textContent = L.sub; $('title').textContent = L.titles[this.mode];
    $('g-mode').textContent = L.gMode; $('g-units').textContent = L.gUnits;
    $('calc-h').textContent = L.calc; $('ctl-h').textContent = L.ctl; $('reset').textContent = L.reset; $('foot').textContent = L.foot;
    $('modes').innerHTML = Object.keys(L.modes).map(k => `<button type="button" data-m="${k}" aria-pressed="${k === this.mode}">${L.modes[k]}</button>`).join('');
    $('modes').onclick = e => { const b = e.target.closest('[data-m]'); if (b) this.setMode(b.dataset.m); };
    $('units').innerHTML = ['imperial', 'SI'].map(k => `<button type="button" data-u="${k}" aria-pressed="${k === this.units}">${k === 'SI' ? 'SI' : 'Imperial'}</button>`).join('');
    $('units').onclick = e => { const b = e.target.closest('[data-u]'); if (b) this.setUnits(b.dataset.u); };
    $('hint').textContent = this.mode === 'cg' ? L.hintCg : this.mode === 'lever' ? L.hintLever : L.hintBeam;
    this.controls(); this.draw();
  }

  /* ---------- controls (sliders) ---------- */
  controls() {
    const L = t(), u = this.u;
    let h = '';
    if (this.mode === 'cg') {
      h = this.cg.items.map((it, k) => `<div class="row"><label for="w${k}">${L.items[it.id]}</label>` +
        `<input type="range" id="w${k}" data-k="${k}" min="${it.wmin}" max="${it.wmax}" step="${it.id === 'fuel' ? (this.units === 'SI' ? 0.72 * 5 : 6) : u.wStep}" value="${it.w}">` +
        `<output id="o${k}"></output></div>`).join('');
    } else {
      const F = this.units === 'SI' ? 'N' : 'lb';
      h = this.beam.forces.map((o, k) => `<div class="row"><label for="f${k}">${L.force} F${k + 1}</label>` +
        `<input type="range" id="f${k}" data-f="${k}" min="0" max="100" step="5" value="${o.F}"><output id="fo${k}"></output></div>`).join('');
    }
    $('controls').innerHTML = h;
    $('controls').oninput = e => {
      const el = e.target;
      if (el.dataset.k !== undefined) this.cg.items[+el.dataset.k].w = Math.round(+el.value * 100) / 100;
      if (el.dataset.f !== undefined) this.beam.forces[+el.dataset.f].F = +el.value;
      this.draw();
    };
  }

  /* ---------- dragging ---------- */
  drag(k, p) {
    if (this.mode === 'cg') {
      const i = +k, arm = (p.x - this.X0) / this.S;
      const step = this.u.aStep, lim = this.cg.len;
      this.cg.items[i].arm = Math.max(0, Math.min(lim, Math.round(arm / step) * step));
    } else {
      const x = Math.max(0, Math.min(this.beam.L, Math.round((p.x - this.BX) / this.BS * 2) / 2));   // half-unit steps
      if (k === 'pivot') this.beam.p = x; else this.beam.forces[+k].x = x;
    }
    this.draw();
  }

  draw() { if (this.mode === 'cg') this.drawCG(); else this.drawBeam(); }

  /* ---------- aircraft loading ---------- */
  drawCG() {
    const L = t(), u = this.u, m = this.cg, X0 = 50, S = 900 / m.len; this.X0 = X0; this.S = S;
    const ax = a => X0 + a * S, Y = 170;
    // simple side view of a high-wing four-seater (nose to the left, datum at the nose)
    const q = v => v * m.len / 230;                                      // template drawn in inches
    const body = `M${ax(0)} ${Y} C${ax(q(4))} ${Y - 26} ${ax(q(30))} ${Y - 34} ${ax(q(60))} ${Y - 40} L${ax(q(80))} ${Y - 70} L${ax(q(140))} ${Y - 72} ` +
      `L${ax(q(205))} ${Y - 42} L${ax(q(214))} ${Y - 92} L${ax(q(228))} ${Y - 92} L${ax(q(230))} ${Y - 30} L${ax(q(140))} ${Y + 6} L${ax(q(60))} ${Y + 14} C${ax(q(20))} ${Y + 14} ${ax(q(4))} ${Y + 8} ${ax(0)} ${Y}Z`;
    let s = `<path d="${body}" fill="#1d1a14" stroke="#6b5a35" stroke-width="2"/>` +
      `<rect x="${ax(q(70))}" y="${Y - 78}" width="${q(70) * S}" height="8" fill="#6b5a35"/>` +
      `<circle cx="${ax(q(40))}" cy="${Y + 40}" r="10" fill="#2a2620" stroke="#6b5a35"/><line x1="${ax(q(40))}" y1="${Y + 12}" x2="${ax(q(40))}" y2="${Y + 32}" stroke="#6b5a35" stroke-width="3"/>` +
      `<circle cx="${ax(q(105))}" cy="${Y + 40}" r="10" fill="#2a2620" stroke="#6b5a35"/><line x1="${ax(q(100))}" y1="${Y + 10}" x2="${ax(q(105))}" y2="${Y + 32}" stroke="#6b5a35" stroke-width="3"/>`;
    // ruler and limits
    const RY = 268, step = this.units === 'SI' ? 0.5 : 20, minor = this.units === 'SI' ? 0.1 : 5;
    s += `<rect x="${ax(m.fwd)}" y="${RY - 14}" width="${(m.aft - m.fwd) * S}" height="14" fill="var(--ok)" fill-opacity=".25" stroke="var(--ok)"/>` +
      `<text x="${ax(m.aft) + 6}" y="${RY - 3}" font-size="12" fill="var(--ok)">${L.limits} ${f(m.fwd)}–${f(m.aft)} ${u.a}</text>`;
    s += `<line x1="${X0}" y1="${RY}" x2="${X0 + 900}" y2="${RY}" stroke="var(--muted)"/>`;
    for (let a = 0; a <= m.len + 1e-9; a += minor) {
      const major = Math.abs(a / step - Math.round(a / step)) < 1e-6;
      s += `<line x1="${ax(a)}" y1="${RY}" x2="${ax(a)}" y2="${RY + (major ? 10 : 5)}" stroke="var(--muted)"/>`;
      if (major) s += `<text x="${ax(a)}" y="${RY + 25}" text-anchor="middle" font-size="12" fill="var(--muted)">${f(a)}</text>`;
    }
    s += `<text x="${X0 + 905}" y="${RY + 25}" font-size="12" fill="var(--muted)">${u.a}</text>`;
    s += `<line x1="${X0}" y1="10" x2="${X0}" y2="${RY}" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="${X0 + 4}" y="${RY - 6}" font-size="13" fill="var(--accent)">${L.datum}</text>`;
    // loads: a tag above each station, draggable; tags that would overlap go to the next row
    const lanes = [], TW = 104;
    this.cg.items.map((it, k) => ({it, k, x: ax(it.arm)})).sort((a, b) => a.x - b.x).forEach(g => {
      let r = 0; while (lanes[r] !== undefined && g.x - lanes[r] < TW + 6) r++;
      lanes[r] = g.x;
      const ty = 30 + r * 44, it = g.it, on = it.w > 0, c = on ? 'var(--cold)' : '#555';
      s += `<line x1="${g.x}" y1="${ty + 18}" x2="${g.x}" y2="${RY}" stroke="${on ? 'var(--cold)' : '#444'}" stroke-dasharray="3 3"/>` +
        `<g class="drag" data-drag="${g.k}"><rect x="${g.x - TW / 2}" y="${ty - 18}" width="${TW}" height="36" rx="3" fill="#0d0c0a" stroke="${c}"/>` +
        `<text x="${g.x}" y="${ty - 3}" text-anchor="middle" font-size="11" fill="var(--muted)">${L.short[it.id]}</text>` +
        `<text x="${g.x}" y="${ty + 13}" text-anchor="middle" font-size="14" fill="var(--fg)">${f(it.w, 0)} ${u.w}</text></g>`;
    });
    // CG marker
    const cgx = ax(m.cg), st = m.status(), col = st === 'ok' ? 'var(--ok)' : 'var(--bad)';
    s += `<path d="M${cgx} ${RY - 2} l-10 -16 h20z" fill="${col}"/><text x="${cgx}" y="${RY + 44}" text-anchor="middle" font-size="15" font-weight="700" fill="${col}">${L.cgAt} ${f(m.cg, 1)} ${u.a}</text>`;
    this.scene.innerHTML = s;

    // table and steps
    const rows = m.items.map(it => {
      const extra = it.id === 'fuel' ? ` <span class="note">(${f(it.w / u.fuelPer, 0)} ${u.fuelU})</span>` : '';
      return `<tr><td>${L.items[it.id]}${extra}</td><td>${f(it.w, 0)}</td><td>${f(it.arm)}</td><td>${f(it.w * it.arm, 0)}</td></tr>`;
    }).join('');
    $('calc').innerHTML = `<tr><th>${L.cols[0]}</th><th>${L.cols[1]} (${u.w})</th><th>${L.cols[2]} (${u.a})</th><th>${L.cols[3]} (${u.m})</th></tr>${rows}` +
      `<tr class="tot"><td>${L.total}</td><td>${f(m.W, 0)}</td><td>${f(m.cg, 1)}</td><td>${f(m.M, 0)}</td></tr>`;
    $('steps').innerHTML = `ΣM = ${f(m.M, 0)} ${u.m}<br>ΣW = ${f(m.W, 0)} ${u.w}<br>CG = ΣM / ΣW = ${f(m.M, 0)} / ${f(m.W, 0)} = <b>${f(m.cg, 1)} ${u.a}</b>`;
    $('status').className = 'status ' + (st === 'ok' ? 'ok' : 'bad'); $('status').textContent = L[st];
    m.items.forEach((it, k) => { const o = $('o' + k); if (o) o.textContent = f(it.w, 0) + ' ' + u.w; });
  }

  /* ---------- lever and beam ---------- */
  drawBeam() {
    const L = t(), b = this.beam, BX = 100, BS = 80, Y = 160; this.BX = BX; this.BS = BS;
    const F = this.units === 'SI' ? 'N' : 'lb', D = this.units === 'SI' ? 'm' : 'ft', MU = F + '·' + D;
    const bx = x => BX + x * BS, lever = this.mode === 'lever';
    let tilt = 0, s = '';
    if (lever) { const mo = b.moments(); tilt = Math.max(-7, Math.min(7, mo.net / 40)); }
    const piv = lever ? bx(b.p) : 0;
    // beam (rotated about the pivot when unbalanced)
    let g = `<rect x="${bx(0)}" y="${Y - 8}" width="${b.L * BS}" height="16" fill="#3a3020" stroke="#8a7440"/>`;
    for (let x = 0; x <= b.L; x++) g += `<line x1="${bx(x)}" y1="${Y + 8}" x2="${bx(x)}" y2="${Y + 14}" stroke="var(--muted)"/><text x="${bx(x)}" y="${Y + 28}" text-anchor="middle" font-size="12" fill="var(--muted)">${x}</text>`;
    b.forces.forEach((o, k) => {
      const len = 20 + o.F * 0.9, x = bx(o.x);
      g += `<g class="drag" data-drag="${k}"><rect x="${x - 26}" y="${Y - 30 - len}" width="52" height="24" rx="3" fill="#0d0c0a" stroke="var(--hot)"/>` +
        `<text x="${x}" y="${Y - 13 - len}" text-anchor="middle" font-size="13" fill="var(--fg)">F${k + 1}</text>` +
        `<line x1="${x}" y1="${Y - 6 - len}" x2="${x}" y2="${Y - 14}" stroke="var(--hot)" stroke-width="4"/><path d="M${x - 8} ${Y - 18}L${x} ${Y - 8}L${x + 8} ${Y - 18}Z" fill="var(--hot)"/>` +
        `<text x="${x + 14}" y="${Y - 30}" font-size="13" fill="var(--hot)">${o.F} ${F}</text></g>`;
    });
    s += lever ? `<g transform="rotate(${tilt} ${piv} ${Y + 8})">${g}</g>` : g;

    if (lever) {
      s += `<g class="drag" data-drag="pivot"><path d="M${piv} ${Y + 8}L${piv - 22} ${Y + 50}H${piv + 22}Z" fill="var(--accent)"/><rect x="${piv - 40}" y="${Y + 50}" width="80" height="6" fill="#6b5a35"/></g>`;
      // distances from the pivot
      b.forces.forEach((o, k) => {
        const yy = Y + 80 + k * 22, x1 = piv, x2 = bx(o.x);
        if (o.F > 0 && o.x !== b.p) s += `<line x1="${x1}" y1="${yy}" x2="${x2}" y2="${yy}" stroke="var(--cold)" marker-end=""/><text x="${(x1 + x2) / 2}" y="${yy - 4}" text-anchor="middle" font-size="12" fill="var(--cold)">d${k + 1} = ${f(Math.abs(o.x - b.p))} ${D}</text>`;
      });
    } else {
      const r = b.reactions();
      [[0, 'A', r.RA], [b.L, 'B', r.RB]].forEach(([x, n, R]) => {
        const xx = bx(x), len = 20 + Math.abs(R) * 0.6;
        s += `<path d="M${xx} ${Y + 8}L${xx - 18} ${Y + 40}H${xx + 18}Z" fill="var(--accent)"/>` +
          `<line x1="${xx}" y1="${Y + 44 + len}" x2="${xx}" y2="${Y + 52}" stroke="var(--ok)" stroke-width="4"/><path d="M${xx - 8} ${Y + 56}L${xx} ${Y + 44}L${xx + 8} ${Y + 56}Z" fill="var(--ok)"/>` +
          `<text x="${xx + (x ? -12 : 12)}" y="${Y + 70}" text-anchor="${x ? 'end' : 'start'}" font-size="15" font-weight="700" fill="var(--ok)">R_${n} = ${f(R, 1)} ${F}</text>` +
          `<text x="${xx}" y="${Y - 70}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--accent)">${n}</text>`;
      });
    }
    s += `<text x="${bx(b.L) + 10}" y="${Y + 28}" font-size="12" fill="var(--muted)">${D}</text>`;
    this.scene.innerHTML = s;

    // table, steps, status
    if (lever) {
      const mo = b.moments();
      const rows = b.forces.map((o, k) => {
        const d = o.x - b.p, M = o.F * Math.abs(d);
        return `<tr><td>F${k + 1}</td><td>${o.F}</td><td>${f(Math.abs(d))}</td><td>${f(M)} <span class="note">${d > 0 ? L.cw : d < 0 ? L.acw : ''}</span></td></tr>`;
      }).join('');
      $('calc').innerHTML = `<tr><th></th><th>${L.force} (${F})</th><th>d (${D})</th><th>M (${MU})</th></tr>${rows}`;
      $('steps').innerHTML = `${L.cw}: ${f(mo.cw)} ${MU}<br>${L.acw}: ${f(mo.acw)} ${MU}<br>${L.net} = ${f(mo.cw)} − ${f(mo.acw)} = <b>${f(mo.net)} ${MU}</b>`;
      const bal = Math.abs(mo.net) < 1e-9;
      $('status').className = 'status ' + (bal ? 'ok' : 'bad');
      $('status').textContent = bal ? L.balanced : `${L.notBal} ${mo.net > 0 ? L.toCw : L.toAcw}`;
    } else {
      const r = b.reactions();
      const rows = b.forces.map((o, k) => `<tr><td>F${k + 1}</td><td>${o.F}</td><td>${f(o.x)}</td><td>${f(o.F * o.x)}</td></tr>`).join('');
      $('calc').innerHTML = `<tr><th></th><th>${L.force} (${F})</th><th>${L.pos} (${D})</th><th>M_A (${MU})</th></tr>${rows}` +
        `<tr class="tot"><td>${L.total}</td><td>${f(r.sumF)}</td><td></td><td>${f(r.mA)}</td></tr>`;
      $('steps').innerHTML = `R_B · ${b.L} = ${f(r.mA)} ⇒ R_B = ${f(r.mA)} / ${b.L} = <b>${f(r.RB, 1)} ${F}</b><br>R_A = ΣF − R_B = ${f(r.sumF)} − ${f(r.RB, 1)} = <b>${f(r.RA, 1)} ${F}</b>`;
      $('status').className = 'status'; $('status').textContent = '';
    }
    b.forces.forEach((o, k) => { const e = $('fo' + k); if (e) e.textContent = o.F + ' ' + F; });
  }
}

/* ============================ "Solve it" questions ============================ */
// Each generator mirrors a template of the question bank and can load its numbers into the simulation.
const Q = (el, en) => ({el, en});
const fl = (x, d, l) => page.fmtIn(x, d, l);
const V = (x, u, d = 2) => Q(fl(x, d, 'el') + ' ' + u, fl(x, d, 'en') + ' ' + u);   // an option in both languages
const QUIZ = [
  // cg.cg_two_imperial
  () => {
    const W1 = rnd(12, 25) * 100, a1 = rnd(6, 12) * 5, W2 = rnd(4, 12) * 50, a2 = rnd(14, 28) * 5;
    const M = W1 * a1 + W2 * a2, cg = M / (W1 + W2), avg = (a1 + a2) / 2, sw = (W1 * a2 + W2 * a1) / (W1 + W2);
    return {
      q: Q(`Αεροσκάφος: κενό βάρος ${W1} lb σε βραχίονα ${a1} in από το datum, και πιλότος με επιβάτη συνολικά ${W2} lb σε βραχίονα ${a2} in. Η θέση του CG από το datum είναι:`,
           `Aircraft: empty weight ${W1} lb at an arm of ${a1} in from the datum, and a pilot and passenger totalling ${W2} lb at an arm of ${a2} in. The CG location from the datum is:`),
      o: [V(cg, 'in', 1), V(avg, 'in', 1), V(sw, 'in', 1)], a: 0,
      x: Q(`ΣM = ${W1}×${a1} + ${W2}×${a2} = ${fl(M, 0, 'el')} in·lb. ΣW = ${W1 + W2} lb. CG = ΣM/ΣW ≈ ${fl(cg, 1, 'el')} in. Δεν είναι ο μέσος όρος των βραχιόνων.`,
           `ΣM = ${W1}×${a1} + ${W2}×${a2} = ${fl(M, 0, 'en')} in·lb. ΣW = ${W1 + W2} lb. CG = ΣM/ΣW ≈ ${fl(cg, 1, 'en')} in. It is not the average of the arms.`),
      apply: () => loadCG('imperial', [[W1, a1], [W2, a2], [0], [0], [0]])
    };
  },
  // cg.cg_two_SI
  () => {
    const W1 = rnd(6, 10) * 100, a1 = rnd(1, 2), W2 = rnd(1, 4) * 50, a2 = rnd(3, 4);
    const M = W1 * a1 + W2 * a2, cg = M / (W1 + W2);
    return {
      q: Q(`Μικρό αεροσκάφος: κενή μάζα ${W1} kg σε βραχίονα ${a1} m από το datum και φορτίο ${W2} kg σε βραχίονα ${a2} m. Το CG από το datum είναι:`,
           `Small aircraft: empty mass ${W1} kg at an arm of ${a1} m from the datum and a load of ${W2} kg at an arm of ${a2} m. The CG from the datum is:`),
      o: [V(cg, 'm'), V((a1 + a2) / 2, 'm'), V(M / W1, 'm')], a: 0,
      x: Q(`ΣM = ${W1}×${a1} + ${W2}×${a2} = ${fl(M, 0, 'el')} kg·m. Συνολική μάζα ${W1 + W2} kg. CG = ${fl(cg, 2, 'el')} m.`,
           `ΣM = ${W1}×${a1} + ${W2}×${a2} = ${fl(M, 0, 'en')} kg·m. Total mass ${W1 + W2} kg. CG = ${fl(cg, 2, 'en')} m.`),
      apply: () => loadCG('SI', [[W1, a1], [W2, a2], [0], [0], [0]])
    };
  },
  // cg.cg_three_imperial
  () => {
    const W1 = rnd(15, 22) * 100, a1 = rnd(7, 10) * 5, W2 = rnd(3, 8) * 50, a2 = rnd(16, 20) * 5, W3 = rnd(1, 4) * 60, a3 = rnd(18, 26) * 5;
    const M = W1 * a1 + W2 * a2 + W3 * a3, W = W1 + W2 + W3, cg = M / W;
    return {
      q: Q(`Φορτωμένο αεροσκάφος: κενό ${W1} lb στα ${a1} in, πλήρωμα ${W2} lb στα ${a2} in και καύσιμο ${W3} lb στα ${a3} in (όλα από το datum). Το CG από το datum είναι:`,
           `Loaded aircraft: empty ${W1} lb at ${a1} in, crew ${W2} lb at ${a2} in and fuel ${W3} lb at ${a3} in (all from the datum). The CG from the datum is:`),
      o: [V(cg, 'in', 1), V((a1 + a2 + a3) / 3, 'in', 1), V(M / W1, 'in', 1)], a: 0,
      x: Q(`ΣM = ${fl(M, 0, 'el')} in·lb, ΣW = ${W} lb, CG = ΣM/ΣW ≈ ${fl(cg, 1, 'el')} in.`, `ΣM = ${fl(M, 0, 'en')} in·lb, ΣW = ${W} lb, CG = ΣM/ΣW ≈ ${fl(cg, 1, 'en')} in.`),
      apply: () => loadCG('imperial', [[W1, a1], [W2, a2], [0], [W3, a3], [0]])
    };
  },
  // cg.moment and cg.arm_from_moment
  () => {
    const W = rnd(2, 12) * 50, a = rnd(4, 30) * 5, M = W * a;
    if (Math.random() < .5) return {
      q: Q(`Ένα εξάρτημα βάρους ${W} lb τοποθετείται σε βραχίονα ${a} in από το datum. Η ροπή του είναι:`, `A piece of equipment weighing ${W} lb is installed at an arm of ${a} in from the datum. Its moment is:`),
      o: [V(M, 'in·lb'), V(W + a, 'in·lb'), V(W / a, 'in·lb', 1)], a: 0,
      x: Q(`Ροπή = βάρος × βραχίονας = ${W}×${a} = ${fl(M, 0, 'el')} in·lb.`, `Moment = weight × arm = ${W}×${a} = ${fl(M, 0, 'en')} in·lb.`),
      apply: () => loadCG('imperial', [[0], [0], [0], [0], [W, a]])
    };
    return {
      q: Q(`Ένα εξάρτημα βάρους ${W} lb έχει ροπή ${fl(M, 0, 'el')} in·lb ως προς το datum. Ο βραχίονάς του είναι:`, `A piece of equipment weighing ${W} lb has a moment of ${fl(M, 0, 'en')} in·lb about the datum. Its arm is:`),
      o: [V(a, 'in'), V(2 * a, 'in'), V(M - W, 'in')], a: 0,
      x: Q(`Βραχίονας = ροπή / βάρος = ${fl(M, 0, 'el')}/${W} = ${a} in.`, `Arm = moment / weight = ${fl(M, 0, 'en')}/${W} = ${a} in.`),
      apply: () => loadCG('imperial', [[0], [0], [0], [0], [W, a]])
    };
  },
  // torque.beam_reaction
  () => {
    const Lb = pick([4, 5, 8, 10]), d = rnd(1, Lb - 1), F = pick([20, 40, 50, 80, 100]);
    const RB = F * d / Lb, RA = F - RB;
    if (Math.abs(RA - RB) < 1e-9) return QUIZ[4]();               // a central load would make two options equal
    return {
      q: Q(`Δοκός μήκους ${Lb} m στηρίζεται στα άκρα της, στα σημεία A και B. Φορτίο ${F} N βρίσκεται ${d} m από το A. Η αντίδραση στη στήριξη B (αγνοούμε το βάρος της δοκού) είναι:`,
           `A beam ${Lb} m long rests on supports A and B at its ends. A load of ${F} N sits ${d} m from A. The reaction at support B (ignore the beam's weight) is:`),
      o: [V(RB, 'N'), V(RA, 'N'), V(F / 2 === RB || F / 2 === RA ? F : F / 2, 'N')], a: 0,
      x: Q(`Ροπές ως προς το A: R_B·${Lb} = ${F}×${d}, άρα R_B = ${fl(RB, 2, 'el')} N. Το ${fl(RA, 2, 'el')} N είναι η αντίδραση στο A.`,
           `Moments about A: R_B·${Lb} = ${F}×${d}, so R_B = ${fl(RB, 2, 'en')} N. ${fl(RA, 2, 'en')} N is the reaction at A.`),
      apply: () => loadBeam('beam', Lb, null, [[F, d], [0, Lb]])
    };
  },
  // torque.balance_distance
  () => {
    const F1 = pick([20, 25, 40, 50, 60]), d1 = rnd(1, 4), F2 = pick([10, 20, 40, 50, 80, 100].filter(v => v !== F1));
    const d2 = F1 * d1 / F2;
    if (d2 > 5 || Math.round(d2 * 2) !== d2 * 2) return QUIZ[5]();  // keep the answer on the half-unit grid of the drawing
    return {
      q: Q(`Ένας μοχλός ισορροπεί στο υπομόχλιο. Στη μία πλευρά δρα δύναμη ${F1} N σε απόσταση ${d1} m· στην άλλη δύναμη ${F2} N. Η απόσταση της δεύτερης δύναμης είναι:`,
           `A lever balances on its pivot. On one side a force of ${F1} N acts at ${d1} m; on the other a force of ${F2} N. The distance of the second force is:`),
      o: [V(d2, 'm'), V(F2 * d1 / F1, 'm'), V(F1 * d1 * F2, 'm')], a: 0,
      x: Q(`F₁·d₁ = F₂·d₂, άρα d₂ = ${F1}×${d1}/${F2} = ${fl(d2, 2, 'el')} m.`, `F₁·d₁ = F₂·d₂ so d₂ = ${F1}×${d1}/${F2} = ${fl(d2, 2, 'en')} m.`),
      apply: () => loadBeam('lever', 10, 5, [[F1, 5 - d1], [F2, 5 + d2]])
    };
  },
  // torque.net_moment
  () => {
    const F1 = pick([20, 40, 50, 100]), d1 = rnd(2, 5), F2 = pick([20, 40, 50, 100]), d2 = rnd(1, 4);
    const M1 = F1 * d1, M2 = F2 * d2;
    if (M1 === M2 || M1 + M2 === Math.max(M1, M2)) return QUIZ[6]();
    return {
      q: Q(`Δύναμη ${F1} N σε απόσταση ${d1} m δίνει δεξιόστροφη ροπή ως προς έναν άξονα, ενώ δύναμη ${F2} N σε απόσταση ${d2} m δίνει αριστερόστροφη. Η συνισταμένη ροπή είναι:`,
           `A force of ${F1} N at ${d1} m gives a clockwise moment about an axis, while a force of ${F2} N at ${d2} m gives an anticlockwise one. The net moment is:`),
      o: [V(Math.abs(M1 - M2), 'N·m'), V(M1 + M2, 'N·m'), V(Math.max(M1, M2), 'N·m')], a: 0,
      x: Q(`ΣM = ${F1}×${d1} − ${F2}×${d2} = ${M1 - M2} N·m (${M1 > M2 ? 'δεξιόστροφη' : 'αριστερόστροφη'}). Οι αντίθετες ροπές αφαιρούνται.`,
           `ΣM = ${F1}×${d1} − ${F2}×${d2} = ${M1 - M2} N·m (${M1 > M2 ? 'clockwise' : 'anticlockwise'}). Opposite moments subtract.`),
      apply: () => loadBeam('lever', 10, 5, [[F1, 5 + d1], [F2, 5 - d2]])
    };
  }
];

// Load a question's numbers into the simulation.
function loadCG(units, list) {
  const P = app; P.units = units; P.cg.reset(units); P.mode = 'cg';
  list.forEach(([w, a], k) => { const it = P.cg.items[k]; it.w = w || 0; if (a !== undefined) it.arm = a; if (it.w > it.wmax) it.wmax = it.w; if (it.w < it.wmin) it.wmin = it.w; });
  P.renderAll();
}
function loadBeam(mode, Lb, p, forces) {
  const P = app; P.mode = mode; P.units = 'SI'; P.cg.reset('SI');
  P.beam.L = Lb; if (p !== null) P.beam.p = p;
  P.beam.forces = forces.map(([F, x]) => ({F, x}));
  P.renderAll();
}

const app = new WeightPage();
</script>
