<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Conversions · Physics for Aircraft Engineers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Barlow Condensed",Impact,sans-serif}
header a{color:#fff;text-underline-offset:3px}
main{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:18px}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 10px}
.conv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.conv{grid-template-columns:1fr}}
label{display:block;font-size:15px;color:var(--mute)}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;font:inherit}
input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#result{margin-top:12px;font:700 28px "Barlow Condensed",sans-serif}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font-size:14px;color:var(--mute);font-weight:600}
td:nth-child(2){white-space:nowrap}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header>
  <h1>Unit Conversions</h1>
  <p><a href="index.html">← Home</a> · <a href="bank.html">Question bank</a></p>
</header>
<main>
  <section class="card">
    <h2>Converter</h2>
    <div class="conv">
      <label>Quantity<select id="cat"></select></label>
      <label>Value<input id="val" type="number" value="1" step="any"></label>
      <label>&nbsp;</label>
      <label>From<select id="from"></select></label>
      <label>To<select id="to"></select></label>
    </div>
    <div id="result" aria-live="polite"></div>
  </section>
  <section class="card">
    <h2>Reference table</h2>
    <div class="scroll"><table id="ref"></table></div>
    <p style="color:var(--mute);font-size:15px;margin-bottom:0">Exact values: 1 in = 25.4 mm, 1 lb = 0.45359237 kg. Others rounded to 7 significant figures.
    Standard gravity: g = 32.174 ft/s² = 9.80665 m/s² (the course uses 32.2 ft/s² for exercises).</p>
  </section>
</main>
<script>
// factor = how many base units (SI) in 1 of this unit. Temperature is handled separately.
const DATA = {
  'Length': {base: 'm', units: {'in': 0.0254, 'ft': 0.3048, 'yd': 0.9144, 'mile': 1609.344, 'nautical mile': 1852, 'mm': 0.001, 'cm': 0.01, 'm': 1, 'km': 1000}},
  'Mass': {base: 'kg', units: {'lb (mass)': 0.45359237, 'slug': 14.593903, 'oz': 0.02834952, 'g': 0.001, 'kg': 1}},
  'Force / weight': {base: 'N', units: {'lbf': 4.4482216, 'N': 1, 'kN': 1000, 'kgf': 9.80665}},
  'Pressure': {base: 'Pa', units: {'psi': 6894.757, 'atm': 101325, 'inHg': 3386.389, 'bar': 100000, 'kPa': 1000, 'Pa': 1, 'mmHg (torr)': 133.3224}},
  'Work / energy': {base: 'J', units: {'ft·lb': 1.355818, 'BTU': 1055.056, 'cal': 4.184, 'kcal': 4184, 'J': 1, 'kJ': 1000, 'kWh': 3600000}},
  'Power': {base: 'W', units: {'hp': 745.6999, 'ft·lb/s': 1.355818, 'BTU/h': 0.2930711, 'W': 1, 'kW': 1000}},
  'Torque': {base: 'N·m', units: {'lb·ft': 1.355818, 'lb·in': 0.1129848, 'N·m': 1}},
  'Speed': {base: 'm/s', units: {'ft/s': 0.3048, 'mph': 0.44704, 'knot': 0.5144444, 'km/h': 0.2777778, 'm/s': 1}},
  'Volume': {base: 'm³', units: {'in³': 0.00001638706, 'ft³': 0.02831685, 'US gal': 0.003785412, 'US quart': 0.0009463529, 'L': 0.001, 'm³': 1}},
  'Density': {base: 'kg/m³', units: {'lb/ft³': 16.01846, 'lb/in³': 27679.9, 'slug/ft³': 515.3788, 'kg/m³': 1, 'g/cm³': 1000}},
  'Temperature': {base: 'K', units: {'°F': 1, '°C': 1, 'K': 1, '°R': 1}}
};
const $ = id => document.getElementById(id);

// Temperature conversions go through kelvin.
const toK = {'°F': v => (v - 32) * 5 / 9 + 273.15, '°C': v => v + 273.15, 'K': v => v, '°R': v => v * 5 / 9};
const fromK = {'°F': k => (k - 273.15) * 9 / 5 + 32, '°C': k => k - 273.15, 'K': k => k, '°R': k => k * 9 / 5};

function convert(cat, v, from, to) {
  if (cat === 'Temperature') return fromK[to](toK[from](v));
  const u = DATA[cat].units;
  return v * u[from] / u[to];
}
const fmt = x => Math.abs(x) >= 1e6 || (x !== 0 && Math.abs(x) < 1e-3) ? x.toExponential(4) : String(+x.toPrecision(7));

function fillUnits() {
  const names = Object.keys(DATA[$('cat').value].units);
  $('from').innerHTML = $('to').innerHTML = names.map(n => `<option>${n}</option>`).join('');
  $('to').selectedIndex = Math.min(names.length - 1, 1);
  update();
}
function update() {
  const v = parseFloat($('val').value);
  if (isNaN(v)) { $('result').textContent = ''; return; }
  $('result').textContent = `${fmt(v)} ${$('from').value} = ${fmt(convert($('cat').value, v, $('from').value, $('to').value))} ${$('to').value}`;
}

$('cat').innerHTML = Object.keys(DATA).map(c => `<option>${c}</option>`).join('');
$('cat').onchange = fillUnits;
['val', 'from', 'to'].forEach(id => $(id).addEventListener('input', update));
fillUnits();

// Reference table: 1 unit of each imperial unit in its SI counterpart
const REF = [['Length', 'in', 'ft', 'mile'], ['Mass', 'lb (mass)', 'slug'], ['Force / weight', 'lbf'], ['Pressure', 'psi', 'inHg', 'atm'],
  ['Work / energy', 'ft·lb', 'BTU'], ['Power', 'hp', 'ft·lb/s'], ['Torque', 'lb·ft', 'lb·in'], ['Speed', 'ft/s', 'mph', 'knot'],
  ['Volume', 'US gal', 'ft³'], ['Density', 'lb/ft³', 'slug/ft³']];
$('ref').innerHTML = '<tr><th>Quantity</th><th>Imperial</th><th>SI equivalent</th></tr>' +
  REF.flatMap(([cat, ...us]) => us.map(u => `<tr><td>${cat}</td><td>1 ${u}</td><td>${fmt(DATA[cat].units[u])} ${DATA[cat].base}</td></tr>`)).join('') +
  '<tr><td>Temperature</td><td>°F</td><td>°C = (°F − 32) × 5/9 &nbsp;·&nbsp; K = °C + 273.15</td></tr>';
</script>
</body>
</html>
