<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Physics for Aircraft Engineers · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Barlow Condensed",Impact,sans-serif}
header p{margin:6px 0 0;color:#b9c6d0}
main{max-width:1000px;margin:20px auto;padding:0 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;overflow-x:auto}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 8px}
.note,.meta{color:var(--mute);font-size:15px}
.btn{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600;background:var(--blue);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad)}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:inherit;width:100%;max-width:260px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.err{color:var(--bad);min-height:1.4em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--field,#fff);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.tile b{display:block;font:700 30px/1.1 "Barlow Condensed",sans-serif}.tile span{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(232,163,23,.12)}
.tb{display:grid;grid-template-columns:minmax(0,230px) 1fr 90px;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.tb .bar{height:10px;background:var(--line)}.tb .bar i{display:block;height:100%;background:var(--blue)}
.tb .bar i.weak{background:var(--bad)}.tb .bar i.good{background:var(--ok)}
.mis{margin:4px 0}.mis .en{display:block;color:var(--mute);font-size:.9em}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header><h1>Admin</h1><p>Results of all registered players. Only you can open this (admin key).</p></header>
<main id="main"></main>
<script src="m2meta.js"></script>
<script src="scoreboard.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Board.esc;
const pc = (c, n) => n ? Math.round(c / n * 100) : 0;
const ago = t => { if (!t) return '–'; const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };

class Admin {
  constructor(board, meta) { this.b = board; this.meta = meta; this.users = []; this.sort = {k: 'l', dir: -1}; this.misc = null; }
  get key() { try { return sessionStorage.getItem('physq-admin') || ''; } catch (e) { return ''; } }
  set key(v) { try { v ? sessionStorage.setItem('physq-admin', v) : sessionStorage.removeItem('physq-admin'); } catch (e) {} }
  tname(t) { const i = this.meta && this.meta.topics[t]; return i ? i.en : t; }

  async api(path, body) {
    try {
      const r = await fetch(this.b.url + path, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json', 'X-Admin-Key': this.key}, body: body ? JSON.stringify(body) : undefined});
      let data = {}; try { data = await r.json(); } catch (e) {}
      return {ok: r.ok, status: r.status, data};
    } catch (e) { return {ok: false, status: 0, data: {error: 'Cannot reach the server'}}; }
  }

  login() {
    $('main').innerHTML = `<section><h2>Admin key</h2><form id="f"><input id="k" type="password" autocomplete="off" placeholder="ADMIN_KEY">
      <div class="row"><button class="btn" type="submit">Open</button></div><p class="err" id="err"></p></form></section>`;
    $('f').onsubmit = async e => { e.preventDefault(); this.key = $('k').value; this.load(); };
  }

  async load() {
    $('main').innerHTML = '<section><p class="note">Loading…</p></section>';
    const r = await this.api('/admin/users');
    if (!r.ok) { this.key = ''; this.login(); $('err').textContent = r.data.error || 'Failed'; return; }
    this.users = r.data.users; this.list();
  }

  // ---------- class overview + table ----------
  list() {
    const U = this.users, act = U.filter(u => u.n), wk = Date.now() - 7 * 864e5;
    const N = act.reduce((a, u) => a + u.n, 0), C = act.reduce((a, u) => a + u.c, 0);
    const top = {};
    act.forEach(u => Object.entries(u.p || {}).forEach(([t, v]) => { const a = top[t] || (top[t] = {c: 0, n: 0}); a.c += v[0]; a.n += v[1]; }));
    const ts = Object.keys(top).sort((a, b) => pc(top[a].c, top[a].n) - pc(top[b].c, top[b].n));
    const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
    const bars = ts.map(t => { const a = top[t], p = pc(a.c, a.n), cls = a.n >= 20 ? (p < 60 ? 'weak' : p >= 75 ? 'good' : '') : '';
      return `<div class="tb"><span>${esc(this.tname(t))}</span><div class="bar"><i class="${cls}" style="width:${p}%"></i></div><span>${p} % <small>${a.n}</small></span></div>`; }).join('');
    $('main').innerHTML = `<section><div class="row" style="justify-content:space-between;margin:0"><h2 style="margin:0">Class overview</h2>
        <span><button class="btn alt" id="csv" type="button">Download CSV</button> <button class="btn alt" id="out" type="button">Lock</button></span></div>
      <div class="tiles" style="margin-top:10px">${tile(U.length, 'registered players')}${tile(act.length, 'with results')}${tile(U.filter(u => u.l > wk).length, 'active in last 7 days')}
        ${tile(N, 'questions answered')}${tile(pc(C, N) + ' %', 'class accuracy')}${tile(act.reduce((a, u) => a + (u.t || 0), 0), 'timed tests')}</div></section>
      ${ts.length ? `<section><h2>Chapters, whole class</h2><p class="note">Weakest first. Number = answers given.</p>${bars}</section>` : ''}
      <section><h2>Players</h2><p class="note">Click a column to sort, a row to open the player. Players who registered before the last Worker update appear without numbers until their next session.</p>
        <table><thead><tr>${[['nick', 'Nickname'], ['n', 'Questions'], ['acc', 'Accuracy'], ['t', 'Timed tests'], ['b', 'Best test'], ['d', 'Days'], ['l', 'Last active']].map(h => `<th data-k="${h[0]}">${h[1]}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></section>`;
    $('out').onclick = () => { this.key = ''; this.login(); };
    $('csv').onclick = () => this.csv();
    document.querySelector('thead').onclick = e => { const k = e.target.dataset.k; if (!k) return; this.sort = {k, dir: this.sort.k === k ? -this.sort.dir : (k === 'nick' ? 1 : -1)}; this.rows(); };
    this.rows();
  }
  rows() {
    const {k, dir} = this.sort, val = u => k === 'acc' ? (u.n ? u.c / u.n : -1) : k === 'nick' ? (u.nick || u.key).toLowerCase() : (u[k] == null ? -1 : u[k]);
    const s = this.users.slice().sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
    $('tb').innerHTML = s.map(u => `<tr data-n="${esc(u.nick || u.key)}"><td><b>${esc(u.nick || u.key)}</b></td><td>${u.n || 0}</td><td>${u.n ? pc(u.c, u.n) + ' %' : '–'}</td><td>${u.t || 0}</td><td>${u.b == null ? '–' : u.b + ' %'}</td><td>${u.d || 0}</td><td>${ago(u.l)}</td></tr>`).join('');
    $('tb').onclick = e => { const tr = e.target.closest('tr'); if (tr) this.detail(tr.dataset.n); };
  }
  csv() {
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [['nickname', 'created', 'questions', 'correct', 'accuracy_pct', 'timed_tests', 'best_test_pct', 'days', 'last_active'].join(',')].concat(this.users.map(u =>
      [q(u.nick || u.key), u.created ? new Date(u.created).toISOString().slice(0, 10) : '', u.n || 0, u.c || 0, u.n ? pc(u.c, u.n) : '', u.t || 0, u.b == null ? '' : u.b, u.d || 0, u.l ? new Date(u.l).toISOString().slice(0, 10) : ''].join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type: 'text/csv'})); a.download = 'players.csv'; a.click();
  }

  // ---------- one player ----------
  async detail(nick) {
    $('main').innerHTML = '<section><p class="note">Loading…</p></section>';
    const r = await this.api('/admin/user?nick=' + encodeURIComponent(nick));
    if (!r.ok) { this.list(); return; }
    const s = r.data.stats, ts = Object.keys(s.topics).sort((a, b) => pc(s.topics[a].c, s.topics[a].n) - pc(s.topics[b].c, s.topics[b].n));
    const bars = ts.map(t => { const a = s.topics[t], p = pc(a.c, a.n), cls = a.n >= 5 ? (p < 60 ? 'weak' : p >= 75 ? 'good' : '') : '';
      return `<div class="tb"><span>${esc(this.tname(t))}</span><div class="bar"><i class="${cls}" style="width:${p}%"></i></div><span>${p} % <small>${a.c}/${a.n}</small></span></div>`; }).join('');
    const hist = s.tests.slice(-15).reverse().map(t => `<tr><td>${new Date(t.t).toLocaleString()}</td><td>${t.m === 'test' ? 'Timed test' : 'Practice'}</td><td>${t.ok}/${t.n}</td><td>${pc(t.ok, t.n)} %</td><td>${Math.round(t.s / 60)} min</td></tr>`).join('');
    const tags = Object.keys(s.tags).sort((a, b) => s.tags[b] - s.tags[a]).slice(0, 8);
    $('main').innerHTML = `<section><div class="row" style="justify-content:space-between;margin:0"><div><h2 style="margin:0">${esc(r.data.nick)}</h2><span class="meta">Registered ${new Date(r.data.created).toLocaleDateString()} · ${s.total.n} questions · ${pc(s.total.c, s.total.n)} % · ${s.days.length} days</span></div>
        <button class="btn alt" id="back" type="button">Back</button></div></section>
      ${ts.length ? `<section><h2>By chapter</h2>${bars}</section>` : ''}
      ${hist ? `<section><h2>Sessions</h2><table><tr><th>Date</th><th>Type</th><th>Score</th><th>%</th><th>Time</th></tr>${hist}</table></section>` : ''}
      ${tags.length ? '<section><h2>Mistakes</h2><div id="mis"></div></section>' : ''}
      <section><h2>Manage</h2><p class="note">Reset PIN: give the player a new PIN (4 to 6 digits). Delete removes the profile, statistics and scoreboard entries for good.</p>
        <div class="row"><input id="np" inputmode="numeric" maxlength="6" placeholder="New PIN"><button class="btn" id="rp" type="button">Reset PIN</button><button class="btn bad" id="del" type="button">Delete player</button></div><p class="err" id="err"></p></section>`;
    $('back').onclick = () => this.load();
    $('rp').onclick = async () => { const x = await this.api('/admin/reset', {nick, pin: $('np').value}); $('err').style.color = x.ok ? 'var(--ok)' : ''; $('err').textContent = x.ok ? 'PIN changed.' : (x.data.error || 'Failed'); };
    $('del').onclick = async () => { if (!confirm('Delete ' + nick + ' for good?')) return; const x = await this.api('/admin/delete', {nick}); x.ok ? this.load() : $('err').textContent = x.data.error || 'Failed'; };
    if (tags.length) this.mistakes(tags, s.tags);
  }
  loadMisc() {
    if (this.misc) return Promise.resolve(this.misc);
    return new Promise(res => { const sc = document.createElement('script'); sc.src = 'm2bank.js';
      sc.onload = () => res(this.misc = (window.M2_BANK && window.M2_BANK.misc) || {}); sc.onerror = () => res(this.misc = {}); document.head.appendChild(sc); });
  }
  async mistakes(ids, c) {
    const m = await this.loadMisc();
    $('mis').innerHTML = ids.map(t => `<p class="mis"><b>${c[t]}×</b> ${m[t] ? esc(m[t].en) : esc(t)}</p>`).join('');
  }

  init() { if (!this.b.url) { $('main').innerHTML = '<section><p>BOARD_URL is empty in scoreboard.js.</p></section>'; return; } this.key ? this.load() : this.login(); }
}
new Admin(board, window.M2_META).init();
</script>
</body>
</html>
