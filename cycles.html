<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Κύκλοι Otto και Brayton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: engine cutaway on the left, P–V diagram on the right, step narration and controls underneath. */
:root{
  --bg:#F2F4F6; --panel:#FFFFFF; --fg:#16202A; --muted:#5B6873; --line:#D3DAE0;
  --accent:#0F766E; --accent-soft:rgba(15,118,110,.12);
  --cold:#3B7DD8; --hot:#E4572E;
  --metal:#B9C3CB; --metal-2:#8E9AA4; --port:#E8EDF1; --hub:#69757F; --plug:#EDE7DA;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --panel:#161D23; --fg:#E5EBEF; --muted:#94A2AD; --line:#2A353D;
  --accent:#2DD4BF; --accent-soft:rgba(45,212,191,.14);
  --cold:#5B9BEF; --hot:#F2704A;
  --metal:#4B5761; --metal-2:#66737E; --port:#1F282F; --hub:#82909B; --plug:#9C968B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317; --panel:#161D23; --fg:#E5EBEF; --muted:#94A2AD; --line:#2A353D;
  --accent:#2DD4BF; --accent-soft:rgba(45,212,191,.14);
  --cold:#5B9BEF; --hot:#F2704A;
  --metal:#4B5761; --metal-2:#66737E; --port:#1F282F; --hub:#82909B; --plug:#9C968B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font:700 clamp(24px,4vw,34px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.card h2{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 4px 6px}
svg{display:block;width:100%;height:auto}
.read{display:flex;flex-wrap:wrap;gap:6px 18px;font:13px var(--f-mono);color:var(--muted);margin:6px 4px 0;font-variant-numeric:tabular-nums}
.read b{color:var(--fg);font-weight:500}
.tbar{display:flex;align-items:center;gap:8px;font:12px var(--f-body);color:var(--muted);margin:8px 4px 0}
.tbar i{display:block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(220 72% 52%),hsl(275 72% 54%),hsl(330 72% 56%),hsl(25 72% 52%))}
.narr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
@media (max-width:820px){.narr{grid-template-columns:1fr}}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.pill[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.pill.done{color:var(--fg)}
#stitle{font:700 21px/1.2 var(--f-display);margin:0 0 6px}
#stext{margin:0;max-width:68ch}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.badge{font:500 12.5px var(--f-body);padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg)}
.badge.q-in{border-color:var(--hot);color:var(--hot)}
.badge.q-out{border-color:var(--cold);color:var(--cold)}
.badge.w{border-color:var(--accent);color:var(--accent)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer;min-width:44px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ctrl label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
select{font:500 13px var(--f-body);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.note{color:var(--muted);font-size:13px;margin:0}
.flow{stroke-dasharray:6 6;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
text{font-family:var(--f-body)}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
      <p class="sub"><a href="index.html" style="color:var(--accent)">← Home</a></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Cycle">
        <button id="tab-otto" aria-pressed="true">Otto</button>
        <button id="tab-brayton" aria-pressed="false">Brayton</button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-el" aria-pressed="true">ΕΛ</button>
        <button id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <section class="card">
      <h2 id="eng-h"></h2>
      <div id="engine"></div>
      <div class="read" id="eng-read"></div>
      <div class="tbar"><span id="t-cold"></span><i></i><span id="t-hot"></span></div>
    </section>
    <section class="card">
      <h2 id="pv-h"></h2>
      <div id="pv"></div>
      <div class="read" id="pv-read"></div>
    </section>
  </div>

  <section class="card narr">
    <div style="min-width:0;padding:4px">
      <div class="steps" id="steps"></div>
      <h3 id="stitle"></h3>
      <p id="stext"></p>
      <div class="badges" id="badges"></div>
    </div>
    <div class="ctrl" style="padding:4px">
      <button class="btn" id="prev" aria-label="Previous step">◀</button>
      <button class="btn primary" id="play"></button>
      <button class="btn" id="next" aria-label="Next step">▶</button>
      <label><span id="speed-l"></span>
        <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      </label>
    </div>
  </section>
  <p class="note" id="foot"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;

/* ---------- text ---------- */
const T = {
 el:{
  h1:'Κύκλοι Otto και Brayton', sub:'Βήμα-βήμα: τι κάνει ο κινητήρας και πού βρίσκεται το αέριο στο διάγραμμα πίεσης–όγκου.',
  engOtto:'Εμβολοφόρος κινητήρας, τετράχρονος', engBray:'Στροβιλοκινητήρας (turbojet), τομή', pv:'Διάγραμμα P–V',
  cold:'κρύο', hot:'ζεστό', play:'Αναπαραγωγή', pause:'Παύση', speed:'Ταχύτητα',
  step:'Βήμα', of:'από', P:'P', V:'V', Tn:'T', atm:'× ατμ.', crank:'Στρόφαλος', rev:'περιστροφή',
  intake:'Εισαγωγή', exhaust:'Εξαγωγή', spark:'Μπουζί', tdc:'ΑΝΣ', bdc:'ΚΝΣ',
  pAxis:'Πίεση P (× ατμοσφαιρική)', vAxis:'Όγκος V', work:'εμβαδόν = έργο',
  secIn:'Είσοδος – συμπιεστής', secCb:'Θάλαμος καύσης', secTu:'Στρόβιλος', secNz:'Ακροφύσιο', secAt:'Ατμόσφαιρα',
  parcel:'Παρακολουθούμε ένα «πακέτο» αέρα',
  footOtto:'Οι αριθμοί είναι ενδεικτικοί: λόγος συμπίεσης 8, ιδανικός κύκλος με γ = 1,4. Στο διάγραμμα η απόσταση των γραμμών εισαγωγής και εξαγωγής είναι μεγεθυμένη για να φαίνονται.',
  footBray:'Οι αριθμοί είναι ενδεικτικοί: λόγος πίεσης 14, ιδανικός κύκλος με γ = 1,4. Όλα τα στάδια γίνονται ταυτόχρονα σε διαφορετικά σημεία του κινητήρα· ακολουθούμε ένα πακέτο αέρα καθώς τα περνά.',
  proc:{isobaric:'ισοβαρής', adiab:'αδιαβατική', isoch:'ισόχωρη', atmLine:'πίεση ≈ ατμοσφαιρική'},
  q0:'Q = 0', qin:'μπαίνει θερμότητα', qout:'φεύγει θερμότητα', win:'μπαίνει έργο', wout:'βγαίνει έργο', w0:'έργο ≈ 0'
 },
 en:{
  h1:'Otto and Brayton cycles', sub:'Step by step: what the engine is doing, and where the gas sits on the pressure–volume diagram.',
  engOtto:'Four-stroke piston engine', engBray:'Gas turbine (turbojet), cross-section', pv:'P–V diagram',
  cold:'cold', hot:'hot', play:'Play', pause:'Pause', speed:'Speed',
  step:'Step', of:'of', P:'P', V:'V', Tn:'T', atm:'× atm', crank:'Crank', rev:'revolution',
  intake:'Intake', exhaust:'Exhaust', spark:'Spark plug', tdc:'TDC', bdc:'BDC',
  pAxis:'Pressure P (× atmospheric)', vAxis:'Volume V', work:'area = work',
  secIn:'Inlet – compressor', secCb:'Combustor', secTu:'Turbine', secNz:'Nozzle', secAt:'Atmosphere',
  parcel:'Following one parcel of air',
  footOtto:'Numbers are illustrative: compression ratio 8, ideal cycle with γ = 1.4. The gap between the intake and exhaust lines is exaggerated so both can be seen.',
  footBray:'Numbers are illustrative: pressure ratio 14, ideal cycle with γ = 1.4. All stages run at the same time in different parts of the engine; we follow one parcel of air through them.',
  proc:{isobaric:'isobaric', adiab:'adiabatic', isoch:'isochoric', atmLine:'pressure ≈ atmospheric'},
  q0:'Q = 0', qin:'heat in', qout:'heat out', win:'work in', wout:'work out', w0:'work ≈ 0'
 }
};

const OTTO_STEPS = [
 {from:'1',to:'2',dur:2.6,th:[0,180],proc:'atmLine',q:'q0',w:'w0',
  el:['Εισαγωγή','Η βαλβίδα εισαγωγής είναι ανοιχτή. Το έμβολο κατεβαίνει από το ΑΝΣ στο ΚΝΣ και αναρροφά μίγμα καυσίμου–αέρα. Ο όγκος μεγαλώνει, η πίεση μένει περίπου ατμοσφαιρική: στο διάγραμμα, οριζόντια γραμμή στο κάτω μέρος.'],
  en:['Intake','The intake valve is open. The piston moves from TDC to BDC and draws in the fuel–air mixture. Volume grows while pressure stays about atmospheric: a horizontal line along the bottom of the diagram.']},
 {from:'2',to:'3',dur:2.6,th:[180,360],proc:'adiab',q:'q0',w:'win',
  el:['Συμπίεση','Και οι δύο βαλβίδες κλείνουν. Το έμβολο ανεβαίνει και συμπιέζει το μίγμα τόσο γρήγορα που δεν προλαβαίνει να φύγει θερμότητα: αδιαβατική συμπίεση. Η πίεση και η θερμοκρασία ανεβαίνουν. Το έργο για τη συμπίεση το δίνει η ορμή του στροφάλου.'],
  en:['Compression','Both valves close. The piston rises and compresses the mixture so fast that no heat can escape: adiabatic compression. Pressure and temperature rise. The work comes from the momentum of the crankshaft.']},
 {from:'3',to:'4',dur:1.3,th:[360,360],proc:'isoch',q:'qin',w:'w0',
  el:['Καύση (σπινθήρας)','Στο ΑΝΣ το μπουζί δίνει σπινθήρα. Το μίγμα καίγεται τόσο γρήγορα που το έμβολο δεν προλαβαίνει να κινηθεί: η θερμότητα μπαίνει σε σταθερό όγκο. Η πίεση εκτινάσσεται, κατακόρυφη γραμμή στο διάγραμμα.'],
  en:['Combustion (spark)','At TDC the spark plug fires. The mixture burns so fast that the piston has no time to move: heat is added at constant volume. Pressure shoots up, a vertical line on the diagram.']},
 {from:'4',to:'5',dur:2.6,th:[360,540],proc:'adiab',q:'q0',w:'wout',
  el:['Ισχύς (εκτόνωση)','Τα καυτά αέρια σπρώχνουν το έμβολο προς τα κάτω και γυρίζουν τον στρόφαλο. Η εκτόνωση είναι αδιαβατική: η πίεση και η θερμοκρασία πέφτουν καθώς το αέριο δίνει έργο. Είναι ο μόνος χρόνος που παράγει έργο.'],
  en:['Power (expansion)','The hot gases push the piston down and turn the crankshaft. The expansion is adiabatic: pressure and temperature fall as the gas does work. This is the only stroke that produces work.']},
 {from:'5',to:'6',dur:1.1,th:[540,540],proc:'isoch',q:'qout',w:'w0',
  el:['Ανοίγει η βαλβίδα εξαγωγής','Στο ΚΝΣ ανοίγει η βαλβίδα εξαγωγής. Η πίεση πέφτει απότομα στην ατμοσφαιρική και η θερμότητα που περισσεύει φεύγει με τα καυσαέρια. Ο όγκος δεν αλλάζει: κατακόρυφη γραμμή προς τα κάτω.'],
  en:['Exhaust valve opens','At BDC the exhaust valve opens. Pressure drops suddenly to atmospheric and the leftover heat leaves with the exhaust gas. Volume does not change: a vertical line downward.']},
 {from:'6',to:'1',dur:2.6,th:[540,720],proc:'atmLine',q:'q0',w:'w0',
  el:['Εξαγωγή','Το έμβολο ανεβαίνει και σπρώχνει τα καυσαέρια έξω, σε πίεση περίπου ατμοσφαιρική. Στο ΑΝΣ ο κύκλος ξαναρχίζει. Ένας πλήρης κύκλος χρειάζεται δύο περιστροφές του στροφάλου.'],
  en:['Exhaust','The piston rises and pushes the exhaust out at about atmospheric pressure. At TDC the cycle starts again. One full cycle takes two crankshaft revolutions.']}
];
const BRAY_STEPS = [
 {from:'1',to:'2',dur:3.0,proc:'adiab',q:'q0',w:'win',sec:0,
  el:['Συμπίεση','Ο αέρας μπαίνει από την είσοδο σε ατμοσφαιρική πίεση. Τα πτερύγια του συμπιεστή τον συμπιέζουν γρήγορα, αδιαβατικά: η πίεση ανεβαίνει πολύ, ο όγκος μικραίνει, ο αέρας ζεσταίνεται. Το έργο το δίνει ο στρόβιλος μέσω του άξονα.'],
  en:['Compression','Air enters the inlet at atmospheric pressure. The compressor blades squeeze it quickly and adiabatically: pressure rises a lot, volume shrinks, the air warms up. The work comes from the turbine through the shaft.']},
 {from:'2',to:'3',dur:2.4,proc:'isobaric',q:'qin',w:'w0',sec:1,
  el:['Καύση','Στον θάλαμο καύσης ψεκάζεται καύσιμο και καίγεται συνεχώς. Ο θάλαμος είναι ανοιχτός μπρος και πίσω, οπότε το αέριο δεν κρατιέται σε σταθερό όγκο: διαστέλλεται και ρέει. Η θερμότητα μπαίνει σε σταθερή πίεση, οριζόντια γραμμή στο διάγραμμα.'],
  en:['Combustion','Fuel is sprayed into the combustor and burns continuously. The combustor is open at both ends, so the gas cannot be held at constant volume: it expands and flows on. Heat is added at constant pressure, a horizontal line on the diagram.']},
 {from:'3',to:'4',dur:3.2,proc:'adiab',q:'q0',w:'wout',sec:2,
  el:['Εκτόνωση: στρόβιλος και ακροφύσιο','Το καυτό αέριο εκτονώνεται αδιαβατικά. Πρώτα στον στρόβιλο, που παίρνει όσο έργο χρειάζεται ο συμπιεστής (ως το σημείο t). Το υπόλοιπο εκτονώνεται στο ακροφύσιο και γίνεται ταχύτητα: αυτή είναι η ώση.'],
  en:['Expansion: turbine and nozzle','The hot gas expands adiabatically. First through the turbine, which takes the work the compressor needs (up to point t). The rest expands in the nozzle and becomes velocity: that is the thrust.']},
 {from:'4',to:'1',dur:2.4,proc:'isobaric',q:'qout',w:'w0',sec:4,
  el:['Απόρριψη θερμότητας στην ατμόσφαιρα','Τα καυσαέρια βγαίνουν και ψύχονται ανακατεύοντας με τον αέρα, σε ατμοσφαιρική πίεση. Αυτό το βήμα γίνεται έξω από τον κινητήρα, γι’ αυτό ο κύκλος λέγεται ανοιχτός. Φρέσκος αέρας μπαίνει στην είσοδο.'],
  en:['Heat rejected to the atmosphere','The exhaust leaves and cools by mixing with the air, at atmospheric pressure. This step happens outside the engine, which is why the cycle is called open. Fresh air enters the inlet.']}
];

/* ---------- state ---------- */
const S = {cycle:'otto', lang:'el', step:0, u:0, playing:false, mode:'all', speed:1};
try{ const l=localStorage.getItem('cyc-lang'); if(l==='en'||l==='el') S.lang=l; }catch(e){}
const L = () => T[S.lang];
const steps = () => S.cycle==='otto' ? OTTO_STEPS : BRAY_STEPS;

/* temperature colour: cold blue → amber → hot red */
function tcol(t){ t=clamp(t); const h=(220+t*165)%360; return `hsl(${h.toFixed(0)} 72% ${52+4*Math.sin(Math.PI*t)}%)`; }

/* ---------- Otto model ---------- */
const OT = {r:70,l:170,cy:360,headY:72,clr:20,stroke:140, Pc:Math.pow(8,1.4), Pmax:46, Pex:1.25};
OT.P5 = OT.Pmax/Math.pow(8,1.4);
function crankFrac(deg){ const a=deg*Math.PI/180, r=OT.r, l=OT.l;
  const s=r*(1-Math.cos(a))+l-Math.sqrt(l*l-r*r*Math.sin(a)**2); return s/(2*r); }
function ottoState(i,u){
  const st=OTTO_STEPS[i], th=st.th[0]+(st.th[1]-st.th[0])*u, f=crankFrac(th), V=1+7*f;
  let P, t;
  if(i===0){P=1; t=0;}
  else if(i===1){P=Math.pow(8/V,1.4); t=(P*V-8)/38;}
  else if(i===2){P=OT.Pc+(OT.Pmax-OT.Pc)*ease(u); t=(P*V-8)/38;}
  else if(i===3){P=OT.Pmax*Math.pow(1/V,1.4); t=(P*V-8)/38;}
  else if(i===4){P=OT.P5+(OT.Pex-OT.P5)*ease(u); t=.32-.04*u;}
  else {P=OT.Pex; t=.28;}
  return {th,V,P,t:clamp(t),f};
}

/* ---------- Brayton model ---------- */
const BR = {P2:14, V1:8, V3:3};
BR.V2 = 8/Math.pow(14,1/1.4); BR.V4 = 3*Math.pow(14,1/1.4); BR.Vt = 3*Math.pow(14/4,1/1.4);
function brayState(i,u){
  let x,V,P,op=1;
  if(i===0){ x=20+240*u; const w=clamp((u-.25)/.75); V=8*Math.pow(BR.V2/8,w); P=Math.pow(8/V,1.4); }
  else if(i===1){ x=260+110*u; V=BR.V2+(3-BR.V2)*u; P=14; }
  else if(i===2){ if(u<.4){const w=u/.4; x=370+80*w; V=3*Math.pow(BR.Vt/3,w);} else {const w=(u-.4)/.6; x=450+110*w; V=BR.Vt*Math.pow(BR.V4/BR.Vt,w);} P=14*Math.pow(3/V,1.4); }
  else { x=560+90*u; V=BR.V4+(8-BR.V4)*u; P=1; op=u<.5?1:1-(u-.5)/.5; }
  return {x,V,P,t:clamp((P*V-8)/34),op};
}
const model = (i,u) => S.cycle==='otto' ? ottoState(i,u) : brayState(i,u);

/* ---------- P–V diagram ---------- */
const PV = {x0:58,x1:400,y0:298,y1:22};
function pvCfg(){ return S.cycle==='otto'
  ? {Vmax:9,Pmax:50,pt:[0,10,20,30,40,50],vt:[1,2,3,4,5,6,7,8],fill:[1,2,3,4],
     labels:[['1',1,1,-16,6],['2',8,1,10,16],['3',1,OT.Pc,-16,5],['4',1,OT.Pmax,-16,5],['5',8,OT.P5,10,-8],['6',8,OT.Pex,10,3]]}
  : {Vmax:21,Pmax:16,pt:[0,4,8,12,16],vt:[0,5,10,15,20],fill:[0,1,2,3],
     labels:[['1',8,1,-4,18],['2',BR.V2,14,-16,5],['3',3,14,4,-9],['4',BR.V4,1,8,-8],['t',BR.Vt,4,9,-6]]}; }
const sx = V => PV.x0+V/pvCfg().Vmax*(PV.x1-PV.x0);
const sy = P => PV.y0-P/pvCfg().Pmax*(PV.y0-PV.y1);
let SAMPLES = [];
function sample(){ SAMPLES = steps().map((_,i)=>{ const a=[]; for(let k=0;k<=48;k++){ const s=model(i,k/48); a.push([sx(s.V),sy(s.P)]);} return a; }); }
const pathOf = pts => pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');

function buildPV(){
  const c=pvCfg(), l=L(); sample();
  let g='';
  c.pt.forEach(p=>{ g+=`<line x1="${PV.x0}" x2="${PV.x1}" y1="${sy(p)}" y2="${sy(p)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${PV.x0-8}" y="${sy(p)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${p}</text>`; });
  c.vt.forEach(v=>{ g+=`<text x="${sx(v)}" y="${PV.y0+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${v}</text>`; });
  const fillPts = c.fill.flatMap(i=>SAMPLES[i]);
  const lab = c.labels.map(([n,V,P,dx,dy])=>`<circle cx="${sx(V)}" cy="${sy(P)}" r="${n==='t'?3:3.5}" fill="${n==='t'?'none':'var(--fg)'}" stroke="var(--fg)" stroke-width="1.2"/>
    <text x="${sx(V)+dx}" y="${sy(P)+dy}" font-size="13" font-weight="600" fill="var(--fg)">${n}</text>`).join('');
  $('pv').innerHTML = `<svg viewBox="0 0 420 340" role="img" aria-label="${l.pv}">
   <defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
   ${g}
   <line x1="${PV.x0}" y1="${PV.y0}" x2="${PV.x1+12}" y2="${PV.y0}" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ax)"/>
   <line x1="${PV.x0}" y1="${PV.y0}" x2="${PV.x0}" y2="${PV.y1-10}" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#ax)"/>
   <text x="${PV.x0}" y="12" font-size="12" fill="var(--muted)">${l.pAxis}</text>
   <text x="${PV.x1}" y="${PV.y0+32}" text-anchor="end" font-size="12" fill="var(--muted)">${l.vAxis}</text>
   <path d="${pathOf(fillPts)} Z" fill="var(--accent)" fill-opacity=".09"/>
   <path d="${pathOf(SAMPLES.flat())}" fill="none" stroke="var(--muted)" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 4"/>
   <path id="pv-done" fill="none" stroke="var(--fg)" stroke-width="2"/>
   <path id="pv-cur" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
   ${lab}
   <circle id="pv-dot" r="8" stroke="var(--fg)" stroke-width="2"/>
   <text x="${S.cycle==='otto'?sx(3.2):sx(6.5)}" y="${S.cycle==='otto'?sy(12):sy(9.5)}" font-size="12" fill="var(--accent)">${l.work}</text>
  </svg>`;
}

/* ---------- engines ---------- */
function buildOtto(){
  const l=L();
  $('engine').innerHTML = `<svg viewBox="0 0 360 450" role="img" aria-label="${l.engOtto}">
   <defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
   <text x="24" y="20" font-size="12" fill="var(--muted)">${l.intake}</text>
   <text x="336" y="20" text-anchor="end" font-size="12" fill="var(--muted)">${l.exhaust}</text>
   <rect x="96" y="24" width="168" height="48" rx="4" fill="var(--metal)"/>
   <rect x="20" y="34" width="124" height="20" fill="var(--port)"/><rect x="128" y="34" width="24" height="38" fill="var(--port)"/>
   <rect x="216" y="34" width="124" height="20" fill="var(--port)"/><rect x="208" y="34" width="24" height="38" fill="var(--port)"/>
   <rect x="20" y="31" width="76" height="3" fill="var(--metal-2)"/><rect x="20" y="54" width="76" height="3" fill="var(--metal-2)"/>
   <rect x="264" y="31" width="76" height="3" fill="var(--metal-2)"/><rect x="264" y="54" width="76" height="3" fill="var(--metal-2)"/>
   <rect x="96" y="72" width="14" height="220" fill="var(--metal)"/><rect x="250" y="72" width="14" height="220" fill="var(--metal)"/>
   <rect id="gas" x="110" y="72" width="140" height="20"/>
   <circle id="flame" cx="180" cy="74" r="0" fill="#F2A33A"/>
   <path id="inflow" class="flow" d="M26 44 H140 V100" fill="none" stroke="var(--cold)" stroke-width="2.5" marker-end="url(#fa)"/>
   <path id="outflow" class="flow" d="M220 100 V44 H334" fill="none" stroke="var(--hot)" stroke-width="2.5" marker-end="url(#fa)"/>
   <g id="vin"><line x1="140" y1="4" x2="140" y2="66" stroke="var(--metal-2)" stroke-width="4"/><rect x="125" y="66" width="30" height="6" rx="2" fill="var(--metal-2)"/></g>
   <g id="vex"><line x1="220" y1="4" x2="220" y2="66" stroke="var(--metal-2)" stroke-width="4"/><rect x="205" y="66" width="30" height="6" rx="2" fill="var(--metal-2)"/></g>
   <rect x="174" y="2" width="12" height="28" rx="3" fill="var(--plug)" stroke="var(--metal-2)"/>
   <rect x="177" y="30" width="6" height="42" fill="var(--metal-2)"/>
   <polygon id="spark" points="180,74 184,82 192,80 186,86 190,94 181,88 174,96 176,86 168,84 177,81" fill="#F9D23C" opacity="0"/>
   <g id="piston"><rect x="112" y="92" width="136" height="50" rx="3" fill="var(--metal-2)"/>
     <line x1="112" y1="100" x2="248" y2="100" stroke="var(--metal)" stroke-width="2"/><line x1="112" y1="107" x2="248" y2="107" stroke="var(--metal)" stroke-width="2"/>
     <circle cx="180" cy="120" r="7" fill="var(--metal)"/></g>
   <circle cx="180" cy="${OT.cy}" r="76" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 5"/>
   <line id="rod" stroke="var(--hub)" stroke-width="11" stroke-linecap="round"/>
   <line id="arm" x1="180" y1="${OT.cy}" stroke="var(--metal-2)" stroke-width="18" stroke-linecap="round"/>
   <circle cx="180" cy="${OT.cy}" r="10" fill="var(--hub)"/>
   <circle id="cpin" r="8" fill="var(--metal)" stroke="var(--hub)" stroke-width="2"/>
   <line x1="270" y1="92" x2="284" y2="92" stroke="var(--muted)"/><text x="290" y="96" font-size="11" fill="var(--muted)">${l.tdc}</text>
   <line x1="270" y1="232" x2="284" y2="232" stroke="var(--muted)"/><text x="290" y="236" font-size="11" fill="var(--muted)">${l.bdc}</text>
  </svg>`;
}

const BX = {cy:140, casing:[[20,62],[110,62],[260,40],[285,52],[370,52],[450,58],[560,36]]};
function Rx(x){ const c=BX.casing; if(x<=c[0][0]) return 62; if(x>=560) return 36+(x-560)*.35;
  for(let k=1;k<c.length;k++) if(x<=c[k][0]){ const [a,ra]=c[k-1],[b,rb]=c[k]; return ra+(rb-ra)*(x-a)/(b-a);} }
function Rh(x){ if(x<80||x>520) return 0; if(x<120) return 16*(x-80)/40; if(x<=450) return 16; return 16*(1-(x-450)/70); }
function tAt(x){ const seg=[[0,0],[110,0],[260,.26],[285,1],[370,1],[450,.62],[560,.34],[660,.12]];
  for(let k=1;k<seg.length;k++) if(x<=seg[k][0]){ const [a,ta]=seg[k-1],[b,tb]=seg[k]; return ta+(tb-ta)*(x-a)/(b-a);} return .1; }
function vAt(x){ return x<110?70:x<260?62:x<370?80:x<450?115:x<560?175:200; }
const SECS = [[20,260,'secIn'],[260,370,'secCb'],[370,450,'secTu'],[450,560,'secNz'],[560,640,'secAt']];
let PARTS = [];
function buildBray(){
  const l=L(), cy=BX.cy, c=BX.casing;
  const up=c.map(([x,r])=>`${x},${cy-r}`).join(' '), dn=c.map(([x,r])=>`${x},${cy+r}`).join(' ');
  let blades='';
  for(let i=0;i<7;i++){ const x=122+i*19, r=Rx(x)-4; blades+=`<line x1="${x}" y1="${cy-16}" x2="${x}" y2="${cy-r}" /><line x1="${x}" y1="${cy+16}" x2="${x}" y2="${cy+r}" />`; }
  let tb=''; for(let i=0;i<4;i++){ const x=382+i*20, r=Rx(x)-4; tb+=`<line x1="${x}" y1="${cy-16}" x2="${x}" y2="${cy-r}" /><line x1="${x}" y1="${cy+16}" x2="${x}" y2="${cy+r}" />`; }
  let fl=''; [300,322,344].forEach(x=>{ [-1,1].forEach(s=>{ const y=cy+s*34; fl+=`<path d="M${x-8} ${y} Q${x} ${y-s*18} ${x+10} ${y} Q${x+2} ${y+s*6} ${x-8} ${y}Z"/>`; }); });
  const bands=SECS.map(([a,b,k],i)=>`<rect class="band" data-i="${i}" x="${a}" y="66" width="${b-a}" height="148" fill="var(--accent)" fill-opacity="0"/>
     <text class="blab" data-i="${i}" x="${(a+b)/2}" y="52" text-anchor="middle" font-size="11.5" fill="var(--muted)">${l[k]}</text>`).join('');
  const hub=`M80 ${cy} L120 ${cy-16} L450 ${cy-16} L520 ${cy} L450 ${cy+16} L120 ${cy+16} Z`;
  $('engine').innerHTML = `<svg viewBox="0 0 650 270" role="img" aria-label="${l.engBray}">
    ${bands}
    <g id="parts"></g>
    <g fill="#F2A33A" id="flames" opacity=".55">${fl}</g>
    <g stroke="var(--metal-2)" stroke-width="3">${blades}${tb}</g>
    <path d="${hub}" fill="var(--hub)"/>
    <polyline points="${up}" fill="none" stroke="var(--metal-2)" stroke-width="6" stroke-linejoin="round"/>
    <polyline points="${dn}" fill="none" stroke="var(--metal-2)" stroke-width="6" stroke-linejoin="round"/>
    <line x1="120" y1="${cy}" x2="450" y2="${cy}" stroke="var(--metal)" stroke-width="2" stroke-dasharray="6 4"/>
    <circle id="parcel" r="8" stroke="var(--fg)" stroke-width="2.5"/>
    <text x="20" y="258" font-size="11.5" fill="var(--muted)">◯ ${l.parcel}</text>
  </svg>`;
  PARTS = [];
  const g=$('parts');
  for(let k=0;k<70;k++){
    const el=document.createElementNS('http://www.w3.org/2000/svg','circle'); el.setAttribute('r','2.3'); g.appendChild(el);
    PARTS.push({el,x:Math.random()*650,f:Math.random(),s:Math.random()<.5?-1:1});
  }
}

/* ---------- render ---------- */
function render(){
  const i=S.step, u=S.u, s=model(i,u), l=L();
  // P–V
  const done = SAMPLES.slice(0,i).flat();
  const cur = SAMPLES[i].filter((_,k)=>k/48<=u); cur.push([sx(s.V),sy(s.P)]);
  $('pv-done').setAttribute('d', pathOf(done.concat(cur)));
  $('pv-cur').setAttribute('d', pathOf(SAMPLES[i]));
  const dot=$('pv-dot'); dot.setAttribute('cx',sx(s.V)); dot.setAttribute('cy',sy(s.P)); dot.setAttribute('fill',tcol(s.t));
  $('pv-read').innerHTML = `<span>${l.P} = <b>${s.P.toFixed(1)}</b> ${l.atm}</span><span>${l.V} = <b>${s.V.toFixed(2)}</b></span><span>${l.Tn}: <b style="color:${tcol(s.t)}">●</b></span>`;
  if(S.cycle==='otto'){
    const y = 72+20*s.V; $('gas').setAttribute('height', y-72); $('gas').setAttribute('fill', tcol(s.t));
    $('piston').setAttribute('transform',`translate(0 ${y-92})`);
    const a=s.th*Math.PI/180, px=180+OT.r*Math.sin(a), py=OT.cy-OT.r*Math.cos(a);
    $('rod').setAttribute('x1',180); $('rod').setAttribute('y1',y+28); $('rod').setAttribute('x2',px); $('rod').setAttribute('y2',py);
    $('arm').setAttribute('x2',px); $('arm').setAttribute('y2',py); $('cpin').setAttribute('cx',px); $('cpin').setAttribute('cy',py);
    const lift = (st,k)=> st===0 ? 12*Math.sin(Math.PI*u) : 0;
    const inL = i===0 ? 12*Math.sin(Math.PI*u) : 0;
    const exL = i===4 ? 12*ease(u) : i===5 ? 12*Math.cos(Math.PI*u/2)**.5 : 0;
    $('vin').setAttribute('transform',`translate(0 ${inL})`); $('vex').setAttribute('transform',`translate(0 ${exL})`);
    $('inflow').style.opacity = i===0 ? 1 : 0; $('outflow').style.opacity = (i===4||i===5) ? 1 : 0;
    $('spark').setAttribute('opacity', i===2 && u<.35 ? 1 : 0);
    $('flame').setAttribute('r', i===2 ? 10+60*ease(u) : 0); $('flame').setAttribute('opacity', i===2 ? .55*(1-u*.6) : 0);
    const rev = s.th<360 ? 1 : 2;
    $('eng-read').innerHTML = `<span>${l.crank} θ = <b>${Math.round(s.th)}°</b></span><span><b>${rev}</b>η ${l.rev} ${l.of} 2</span>`;
  } else {
    const sec = BRAY_STEPS[i].sec;
    document.querySelectorAll('.band').forEach(b=>{ const k=+b.dataset.i; const on = k===sec || (i===2 && k===3);
      b.setAttribute('fill-opacity', on ? .12 : 0); });
    document.querySelectorAll('.blab').forEach(b=>{ const k=+b.dataset.i; const on = k===sec || (i===2 && k===3);
      b.setAttribute('fill', on ? 'var(--fg)' : 'var(--muted)'); b.setAttribute('font-weight', on?600:400); });
    $('flames').setAttribute('opacity', i===1 ? .95 : .5);
    const p=$('parcel'), r=Rx(s.x), h=Rh(s.x), y=BX.cy-(h+.62*(r-h));
    p.setAttribute('cx', s.x); p.setAttribute('cy', y); p.setAttribute('r', 4+2*Math.sqrt(s.V)); p.setAttribute('fill', tcol(s.t)); p.setAttribute('opacity', s.op);
    $('eng-read').innerHTML = `<span>${l[SECS[BRAY_STEPS[i].sec][2]]}${i===2?' → '+l.secNz:''}</span>`;
  }
  // narration
  const st=steps()[i], tx=st[S.lang];
  $('stitle').textContent = `${st.from} → ${st.to} · ${tx[0]}`;
  $('stext').textContent = tx[1];
  const pc = st.proc==='atmLine' ? 'isobaric' : st.proc;
  $('badges').innerHTML = `<span class="badge">${l.proc[pc]}${st.proc==='atmLine'?' · '+l.proc.atmLine:''}</span>
    <span class="badge ${st.q==='qin'?'q-in':st.q==='qout'?'q-out':''}">${l[st.q]}</span>
    <span class="badge ${st.w==='w0'?'':'w'}">${l[st.w]}</span>`;
  document.querySelectorAll('.pill').forEach((b,k)=>{ b.toggleAttribute('aria-current', false);
    if(k===i) b.setAttribute('aria-current','step'); b.classList.toggle('done', k<i); });
}

/* ---------- particles (Brayton, run always) ---------- */
function moveParts(dt){
  PARTS.forEach(p=>{ p.x += vAt(p.x)*dt*S.speed*(S.playing?1:0.0);
    if(p.x>650){ p.x=0; p.f=Math.random(); p.s=Math.random()<.5?-1:1; }
    const r=Rx(p.x), h=Rh(p.x), rr=h+3+p.f*Math.max(2,(r-h-7));
    p.el.setAttribute('cx',p.x.toFixed(1)); p.el.setAttribute('cy',(BX.cy+p.s*rr).toFixed(1)); p.el.setAttribute('fill',tcol(tAt(p.x)));
    p.el.setAttribute('opacity', p.x>560 ? clamp(1-(p.x-560)/90) : .85);
  });
}

/* ---------- build / controls ---------- */
function buildPills(){
  $('steps').innerHTML = steps().map((st,k)=>`<button class="pill" data-k="${k}">${st.from}→${st.to}</button>`).join('');
  document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>go(+b.dataset.k));
}
function buildAll(){
  const l=L();
  document.documentElement.lang = S.lang;
  $('h1').textContent=l.h1; $('sub').textContent=l.sub; $('pv-h').textContent=l.pv;
  $('eng-h').textContent = S.cycle==='otto'?l.engOtto:l.engBray;
  $('t-cold').textContent=l.cold; $('t-hot').textContent=l.hot; $('speed-l').textContent=l.speed;
  $('foot').textContent = S.cycle==='otto'?l.footOtto:l.footBray;
  S.cycle==='otto' ? buildOtto() : buildBray();
  buildPV(); buildPills(); setPlay(S.playing); render(); if(S.cycle!=='otto') moveParts(0);
}
function setPlay(on){ S.playing=on; $('play').textContent = on ? '❚❚ '+L().pause : '▶ '+L().play; }
function go(k){ const n=steps().length; S.step=(k+n)%n; S.u=0; S.mode='one'; setPlay(true); render(); }
$('play').onclick=()=>{ if(S.playing){ setPlay(false);} else { S.mode='all'; if(S.u>=1){S.u=0;} setPlay(true);} };
$('next').onclick=()=>go(S.step+1);
$('prev').onclick=()=>go(S.step-1);
$('speed').onchange=e=>S.speed=+e.target.value;
function setCycle(c){ S.cycle=c; S.step=0; S.u=0; $('tab-otto').setAttribute('aria-pressed',c==='otto'); $('tab-brayton').setAttribute('aria-pressed',c==='brayton'); buildAll(); }
$('tab-otto').onclick=()=>setCycle('otto'); $('tab-brayton').onclick=()=>setCycle('brayton');
function setLang(g){ S.lang=g; try{localStorage.setItem('cyc-lang',g);}catch(e){} $('lang-el').setAttribute('aria-pressed',g==='el'); $('lang-en').setAttribute('aria-pressed',g==='en'); buildAll(); }
$('lang-el').onclick=()=>setLang('el'); $('lang-en').onclick=()=>setLang('en');
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight'){go(S.step+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(S.step-1);e.preventDefault();}
  else if(e.key===' '){ $('play').click(); e.preventDefault(); } });

let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S.playing){
    S.u += dt*S.speed/steps()[S.step].dur;
    if(S.u>=1){ if(S.mode==='one'){ S.u=1; setPlay(false); } else { S.u=0; S.step=(S.step+1)%steps().length; } }
    render();
  }
  if(S.cycle==='brayton') moveParts(dt);
  requestAnimationFrame(tick);
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('lang-el').setAttribute('aria-pressed',S.lang==='el'); $('lang-en').setAttribute('aria-pressed',S.lang==='en');
S.u = .45; buildAll(); if(!reduce){ S.mode='all'; setPlay(true); }
requestAnimationFrame(tick);
</script>

</body>
