<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics for Aircraft Engineers · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Barlow Condensed",Impact,sans-serif}
header p{margin:6px 0 0;color:#b9c6d0;max-width:60ch}
nav{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:underline;text-underline-offset:3px}
main{display:grid;grid-template-columns:1fr 340px;gap:20px;max-width:1150px;margin:20px auto;padding:0 16px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 8px}
h3{font:700 20px "Barlow Condensed",sans-serif;margin:14px 0 4px}
ul{margin:0;padding-left:20px}
li{margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font-size:14px;color:inherit;text-decoration:none;cursor:pointer;font-family:inherit}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{display:inline-block;border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;background:var(--blue);color:#fff;text-decoration:none}
.btn.go{background:var(--amber);color:var(--ink)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.meta{font-size:14px;color:var(--mute)}
.note{color:var(--mute);font-size:15px}
.item{display:block;border-top:1px solid var(--line);padding:8px 0;color:inherit;text-decoration:none}
.item b{color:var(--blue)}
.item span{display:block;color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:inherit;width:100%;max-width:200px}
.board{list-style:none;margin:8px 0;padding:0}
.board li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.board .rk{width:1.6em;color:var(--mute)}.board .nm{flex:1}.board .pt small{color:var(--mute)}.board .me{font-weight:700}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header>
  <h1>Physics for Aircraft Engineers</h1>
  <p>Course hub: what we did in class, practice questions, quizzes and the scoreboard.</p>
  <nav id="links"></nav>
</header>
<main>
  <div>
    <section id="latest"></section>
    <section id="archive"></section>
  </div>
  <div>
    <section id="board"></section>
    <section id="quizzes"></section>
  </div>
</main>
<script src="questions.js"></script>
<script src="mathfmt.js"></script>
<script src="lessons.js"></script>
<script src="scoreboard.js"></script>
<script>
// ---- Configuration: edit the header links here ----
const CONFIG = {
  LINKS: [
    {label: 'Question bank', href: 'bank.html'},
    {label: 'Unit conversions', href: 'units.html'},
    {label: 'Simulations', href: 'simulations.html'},
    {label: 'Materials', href: 'materials.html'},
    {label: 'Formula sheet', href: 'formula.html'}
  ]
};

const $ = id => document.getElementById(id);
const esc = Board.esc;

// The home page: latest lesson report, lesson archive, quick quizzes and the scoreboard.
class HomePage {
  constructor(cfg, lessons, questions) {
    this.cfg = cfg;
    this.questions = questions;
    this.lessons = lessons.slice().sort((a, b) => a.date < b.date ? 1 : -1);   // newest first
    this.tab = 'overall';
  }

  lessonQuestions(L) { return this.questions.filter(q => q.lesson === L.id || (L.questionIds || []).includes(q.id)).length; }
  pretty(d) { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? d : t.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}); }
  seed() { return Math.floor(Math.random() * 1e9); }

  renderLatest() {
    const L = this.lessons[0];
    if (!L) {
      $('latest').innerHTML = '<h2>Latest lesson</h2><p>The first lesson report will appear here after the next class.</p>' +
        `<div class="cta"><a class="btn go" href="bank.html">Open the question bank</a></div>`;
      return;
    }
    const n = this.lessonQuestions(L);
    const topics = (L.topics || []).map(t => `<a class="chip" href="bank.html#${new URLSearchParams({topic: t})}">${esc(t)}</a>`).join('');
    $('latest').innerHTML =
      `<p class="meta">Latest lesson · ${esc(this.pretty(L.date))}</p><h2>${esc(L.title)}</h2>` +
      (L.summary || []).slice(0, 2).map(p => `<p>${mfmt(p)}</p>`).join('') +
      (L.keyPoints && L.keyPoints.length ? `<h3>Key points</h3><ul>${L.keyPoints.slice(0, 5).map(k => `<li>${mfmt(k)}</li>`).join('')}</ul>` : '') +
      (topics ? `<div class="chips">${topics}</div>` : '') +
      `<div class="cta"><a class="btn go" href="lesson.html?d=${encodeURIComponent(L.id)}">Full report${n ? ' + ' + n + ' practice questions' : ''}</a>` +
      `<a class="btn" href="bank.html">Question bank</a></div>`;
  }

  renderArchive() {
    if (!this.lessons.length) { $('archive').hidden = true; return; }
    if (this.lessons.length < 2) { $('archive').innerHTML = '<h2>All lessons</h2><p class="note">Previous lessons will be listed here.</p>'; return; }
    $('archive').innerHTML = '<h2>All lessons</h2>' + this.lessons.map(L =>
      `<a class="item" href="lesson.html?d=${encodeURIComponent(L.id)}"><b>${esc(L.title)}</b><span>${esc(this.pretty(L.date))}${this.lessonQuestions(L) ? ' · ' + this.lessonQuestions(L) + ' questions' : ''}</span></a>`).join('');
  }

  renderQuizzes() {
    const topics = [...new Set(this.questions.map(q => q.topic))].sort();
    const link = (extra, n = 10) => 'bank.html#' + new URLSearchParams({seed: this.seed(), n, ...extra});
    $('quizzes').innerHTML = '<h2>Quizzes</h2><p class="note">Random questions, answers shown right after you pick. Choose a topic or mix everything.</p>' +
      `<div class="cta"><a class="btn go" href="${esc(link({}))}">Random 10, all topics</a><a class="btn" href="${esc(link({exam: 1}, 20))}">Exam mode, 20</a></div>` +
      (topics.length ? `<div class="chips">${topics.map(t => `<a class="chip" href="${esc(link({topic: t}))}">${esc(t)}</a>`).join('')}</div>` : '') +
      `<p class="note">${this.questions.length} questions in the bank.</p>`;
  }

  async renderBoard() {
    const latest = this.lessons[0];
    const tabs = [['overall', 'Overall']].concat(latest ? [['latest', 'Latest lesson']] : []);
    const res = await board.top(this.tab === 'latest' && latest ? latest.id : '');
    $('board').innerHTML = '<h2>Scoreboard</h2>' +
      `<div class="chips">${tabs.map(([k, l]) => `<button class="chip" type="button" data-tab="${k}" aria-pressed="${this.tab === k}">${l}</button>`).join('')}</div>` +
      board.table(res) +
      (Board.valid(board.nick)
        ? `<p class="note">Playing as <b>${esc(board.nick)}</b> · <a href="#" id="chg">change nickname</a></p>`
        : '') +
      `<div id="nickForm" ${Board.valid(board.nick) ? 'hidden' : ''}><p class="note">Pick a nickname (2 to 16 letters or digits). Your scores from lesson quizzes use it.</p>` +
      `<div class="row"><input id="nick" maxlength="16" placeholder="Nickname" value="${esc(board.nick)}"><button class="btn" id="saveNick" type="button">Save</button></div><p class="note" id="nickMsg"></p></div>`;
    $('board').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { this.tab = b.dataset.tab; this.renderBoard(); });
    if ($('chg')) $('chg').onclick = e => { e.preventDefault(); $('nickForm').hidden = false; $('nick').focus(); };
    $('saveNick').onclick = () => {
      const v = $('nick').value.trim();
      if (!Board.valid(v)) { $('nickMsg').textContent = 'Use 2 to 16 letters, digits, spaces, - or _.'; return; }
      board.nick = v; this.renderBoard();
    };
  }

  init() {
    $('links').innerHTML = this.cfg.LINKS.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
    this.renderLatest(); this.renderArchive(); this.renderQuizzes(); this.renderBoard();
  }
}

new HomePage(CONFIG, window.LESSONS || [], window.QUESTIONS || []).init();
</script>
</body>
</html>
