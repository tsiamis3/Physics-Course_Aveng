<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulations · Physics for Aircraft Engineers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Barlow Condensed",Impact,sans-serif}
header p{margin:6px 0 0;color:#b9c6d0}
header a{color:#fff;text-underline-offset:3px}
main{max-width:900px;margin:20px auto;padding:0 16px}
label{display:block;font-size:15px;color:var(--mute);max-width:320px;margin-bottom:16px}
select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;font:inherit}
select:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h2{font:700 26px "Barlow Condensed",sans-serif;margin:22px 0 8px}
.item{display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:10px;color:inherit;text-decoration:none}
.item:hover{border-color:var(--blue)}
.item b{color:var(--blue);font-size:18px}
.item span{display:block;color:var(--mute);font-size:15px}
.tag{font-size:14px;color:var(--mute)}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header>
  <h1>Simulations</h1>
  <p>Interactive simulations to explore the course topics. <a href="index.html">← Home</a> · <a href="bank.html">Question bank</a></p>
</header>
<main>
  <label>Topic<select id="topic"></select></label>
  <div id="list"></div>
</main>
<script>
// To add a simulation: add a line to the right group. link = full URL (opens in a new tab).
// To add a whole new source (e.g. mechsimulator): add another group {source, home, items:[...]}.
const phet = name => 'https://phet.colorado.edu/en/search?q=' + encodeURIComponent(name);   // search link: always finds the sim
const GROUPS = [
  {source: 'PhET Interactive Simulations (University of Colorado Boulder)', home: 'https://phet.colorado.edu/en/simulations', items: [
    {title: 'Forces and Motion: Basics', topic: 'Newton’s Laws & Forces', note: 'Push objects, add friction, see net force and acceleration.', link: phet('Forces and Motion: Basics')},
    {title: 'Forces in 1 Dimension', topic: 'Newton’s Laws & Forces', note: 'Applied force, friction and motion graphs in one dimension.', link: 'https://phet.colorado.edu/en/simulations/forces-1d'},
    {title: 'Friction', topic: 'Friction', note: 'Rub surfaces together and see friction and heat at the atomic level.', link: phet('Friction')},
    {title: 'Ramp: Forces and Motion', topic: 'Friction', note: 'Inclined plane with friction, force components and energy.', link: phet('Ramp: Forces and Motion')},
    {title: 'Projectile Motion', topic: 'Kinematics', note: 'Launch objects, change angle, speed and air resistance.', link: phet('Projectile Motion')},
    {title: 'Ladybug Motion 2D', topic: 'Kinematics', note: 'Position, velocity and acceleration vectors in two dimensions.', link: phet('Ladybug Motion 2D')},
    {title: 'Energy Skate Park: Basics', topic: 'Work, Power & Energy', note: 'Kinetic, potential and thermal energy along a track.', link: phet('Energy Skate Park: Basics')},
    {title: 'Hooke’s Law', topic: 'Work, Power & Energy', note: 'Spring force, spring constant and elastic potential energy.', link: phet('Hooke\'s Law')},
    {title: 'Collision Lab', topic: 'Momentum & Collisions', note: 'Elastic and inelastic collisions, momentum and kinetic energy.', link: phet('Collision Lab')},
    {title: 'Balancing Act', topic: 'Torque & Equilibrium', note: 'Balance a plank with weights at different distances.', link: phet('Balancing Act')},
    {title: 'Torque', topic: 'Torque & Equilibrium', note: 'Apply forces at different radii and watch the rotation.', link: phet('Torque')},
    {title: 'Masses & Springs', topic: 'Oscillations & Waves', note: 'Oscillation period, damping and energy of a spring-mass system.', link: phet('Masses & Springs')},
    {title: 'Pendulum Lab', topic: 'Oscillations & Waves', note: 'Period vs length, mass and gravity, with energy graphs.', link: phet('Pendulum Lab')},
    {title: 'Wave on a String', topic: 'Oscillations & Waves', note: 'Frequency, amplitude, damping and reflection on a string.', link: phet('Wave on a String')},
    {title: 'Fluid Pressure and Flow', topic: 'Fluids & Pressure', note: 'Pressure vs depth, flow rate and the Bernoulli effect.', link: phet('Fluid Pressure and Flow')},
    {title: 'Buoyancy', topic: 'Fluids & Pressure', note: 'Why objects float or sink, with adjustable density.', link: phet('Buoyancy')},
    {title: 'Density', topic: 'Matter & Density', note: 'Compare mass, volume and density of different materials.', link: phet('Density')},
    {title: 'Gas Properties', topic: 'Thermodynamics & Heat', note: 'Pressure, volume and temperature of a gas in a container.', link: phet('Gas Properties')}
  ]}
  // Add mechsimulator here, e.g.:
  // ,{source: 'mechsimulator', home: 'PASTE-HOME-URL', items: [{title: '...', topic: '...', note: '...', link: 'PASTE-URL'}]}
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const topics = [...new Set(GROUPS.flatMap(g => g.items.map(i => i.topic)))].sort();
$('topic').innerHTML = '<option value="">All topics</option>' + topics.map(t => `<option>${esc(t)}</option>`).join('');

function render() {
  const t = $('topic').value;
  $('list').innerHTML = GROUPS.map(g => {
    const items = g.items.filter(i => !t || i.topic === t);
    if (!items.length) return '';
    return `<h2>${esc(g.source)}</h2>` + items.map(i =>
      `<a class="item" href="${esc(i.link)}" target="_blank" rel="noopener"><b>${esc(i.title)}</b> <span class="tag">· ${esc(i.topic)}</span><span>${esc(i.note)}</span></a>`).join('') +
      `<p><a href="${esc(g.home)}" target="_blank" rel="noopener">Browse all at ${esc(new URL(g.home).hostname)} →</a></p>`;
  }).join('') || '<p>No simulations for this topic yet.</p>';
}
$('topic').addEventListener('input', render);
render();
</script>
</body>
</html>
