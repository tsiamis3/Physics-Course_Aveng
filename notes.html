<style>

body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}

table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:rgba(127,127,127,.12)}
math{font-size:1.08em}
math[display=block]{margin:10px 0;overflow-x:auto}
.top{text-align:right;margin:10px 0 0;font-size:14px}
#gate{max-width:420px;margin:60px auto}
#gate input{width:100%;padding:10px;font:inherit;margin:8px 0}
#gate .err{color:#e0675d;min-height:1.4em}
#toc ol{margin:4px 0 10px;padding-left:22px}
a{color:inherit;text-underline-offset:3px}
@media print{header p,#gate,.top,button{display:none}body{background:#fff}section{border:0;break-inside:auto}.lesson{break-before:page}}

}

class Notes {
  constructor() {
    this.$ = id => document.getElementById(id);
    this.$('f').onsubmit = e => { e.preventDefault(); this.open(this.$('pw').value); };
    let saved = null;
    try { saved = sessionStorage.getItem('notes-pw'); } catch (e) {}
    if (saved) this.open(saved, true);
  }
  b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
  async open(pw, quiet) {
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: this.b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256'},
        base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      const buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: this.b64(DATA.iv)}, key, this.b64(DATA.ct));
      this.$('notes').innerHTML = new TextDecoder().decode(buf);
      this.$('gate').remove(); this.$('pr').hidden = false;
      try { sessionStorage.setItem('notes-pw', pw); } catch (e) {}
      if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    } catch (e) {
      if (!quiet) this.$('err').textContent = 'Wrong password.';
    }
  }
}
