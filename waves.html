 },

  titles: {d1: 'A wave on a line of particles', d2: 'Waves on the surface of water', int: 'Interference from two sources'},

  A: 'Amplitude A', f: 'Frequency f (source)', v: 'Speed v (medium)', type: 'Type of wave', trans: 'Transverse', longi: 'Longitudinal', stand: 'Standing (two waves)', restart: '↺ From rest',

  ruleA: 'Sources in antiphase: the rules swap.',

  diffS: 'Beats at P: {fb} Hz, one every {Tb} s.',

};

const page = new SimPage(T);
const Q = (el, en) => ({el, en});
const fl = (x, d, l) => page.fmtIn(x, d, l);
const V = (x, u, d = 2) => Q(fl(x, d, 'el') + (u ? ' ' + u : ''), fl(x, d, 'en') + (u ? ' ' + u : ''));
const TAU = Math.PI * 2;

/* ============================ the page ============================ */
class WavesPage {
  constructor() {
    this.mode = 'd1'; this.t = 0; this.t0 = 0; this.running = true;
    this.S = {
      d1: {A: 40, f: 0.5, v: 100, type: 'trans'},
      d2: {f: 0.8, v: 100, sx: 500, sy: 280},
      int: {f: 1, f2: 1, v: 80, d: 240, ph: 0, show: 'inst', lines: 'on', px: 700, py: 260}
    };
    this.trace = [];
    page.bindLang($('lang-el'), $('lang-en'));
    page.onLang(() => this.renderAll());
    $('play').onclick = () => { this.running = !this.running; this.texts(); };
    $('restart').onclick = () => this.restart();
    $('modes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { this.mode = b.dataset.m; this.restart(); this.renderAll(); } });
    $('controls').addEventListener('input', e => this.input(e));
    $('controls').addEventListener('change', e => this.input(e));
    const cv = $('tank');
    cv.addEventListener('pointerdown', e => { this.dragging = true; cv.setPointerCapture(e.pointerId); this.pointer(e); });
    cv.addEventListener('pointermove', e => { if (this.dragging) this.pointer(e); });
    cv.addEventListener('pointerup', () => { this.dragging = false; });
    this.ctx = cv.getContext('2d');
    this.img = this.ctx.createImageData(250, 140);
    this.off = document.createElement('canvas'); this.off.width = 250; this.off.height = 140;
    this.quiz = new Quiz(page, $('quiz'), QUIZ, {topics: ['waves'], tpls: ['waves.speed_f_lambda', 'waves.wavelength_string', 'waves.period_ms', 'waves.freq_from_period', 'waves.beats', 'waves.wave_theory']});
    this.renderAll();
    this.quiz.next();
    this.last = performance.now();
    requestAnimationFrame(t => this.tick(t));
  }
  get s() { return this.S[this.mode]; }
  restart() { this.t0 = this.t; this.trace = []; this._full = undefined; this.table(); }
  pointer(e) {
    const r = $('tank').getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 1000, y = (e.clientY - r.top) / r.height * 560;
    if (this.mode === 'd2') { this.S.d2.sx = x; this.S.d2.sy = y; }
    else if (this.mode === 'int') { this.S.int.px = x; this.S.int.py = y; }
    this.table();
  }
  input(e) {
    const el = e.target, k = el.dataset.k; if (!k) return;
    this.s[k] = el.type === 'range' ? +el.value : (el.dataset.num ? +el.value : el.value);
    if (k === 'f' || k === 'v' || k === 'type' || k === 'A') this.restart();
    if (k === 'type') this.texts();
    this.table(); this.outputs();
  }
  tick(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    if (this.running) this.t += dt;
    if (this.mode === 'd1') this.draw1(); else if (this.mode === 'd2') this.draw2(); else this.draw3();
    requestAnimationFrame(t => this.tick(t));
  }

  /* ---------- 1D: line of particles ---------- */
  draw1() {
    const {A, f, v, type} = this.S.d1, la = v / f, k = TAU / la, w = TAU * f, t = this.t - this.t0, el = page.lang === 'el';
    const y0 = 150, x0 = 40, x1 = 960, N = 47, track = 23, xm = (x0 + x1) / 2, stand = type === 'stand';
    // Each wave starts from rest at its source and moves out at speed v: ahead of its front the medium is still.
    const right = x => { const ph = w * t - k * (x - x0); return ph < 0 ? 0 : A * Math.sin(ph); };   // from the left end, travelling right
    const left = x => { const ph = w * t - k * (x1 - x); return ph < 0 ? 0 : A * Math.sin(ph); };    // from the right end, travelling left
    const disp = stand ? (x => right(x) + left(x)) : right;
    const frontR = x0 + v * t, frontL = x1 - v * t, full = stand ? t * v >= (x1 - x0) : frontR >= x1;
    let s = `<rect x="0" y="0" width="1000" height="450" fill="#0f1218"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a09882"/></marker></defs>`;
    s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#2d2618" stroke-dasharray="4 6"/>`;
    const path = fn => { let p = ''; for (let x = x0; x <= x1; x += 4) p += (p ? 'L' : 'M') + x + ',' + (y0 - fn(x)).toFixed(1); return p; };
    if (stand) {
      s += `<path d="${path(right)}" fill="none" stroke="#5B9BEF" stroke-width="1.5" opacity=".6"/><path d="${path(left)}" fill="none" stroke="#d9a521" stroke-width="1.5" opacity=".6"/>`;
      s += `<path d="${path(disp)}" fill="none" stroke="#62b886" stroke-width="3"/>`;
    } else if (type === 'trans') s += `<path d="${path(disp)}" fill="none" stroke="#5B9BEF" stroke-width="2" opacity=".55"/>`;
    for (let i = 0; i < N; i++) {
      const xr = x0 + i * (x1 - x0) / (N - 1), u = disp(xr), me = i === track;
      if (type === 'longi') { const cx = xr + u * 0.5; s += `<line x1="${cx.toFixed(1)}" y1="${y0 - 60}" x2="${cx.toFixed(1)}" y2="${y0 + 60}" stroke="${me ? '#F2704A' : '#5B9BEF'}" stroke-width="${me ? 3 : 2}" opacity="${me ? 1 : .75}"/>`; }
      else s += `<circle cx="${xr.toFixed(1)}" cy="${(y0 - u).toFixed(1)}" r="${me ? 8 : 5}" fill="${me ? '#F2704A' : (stand ? '#62b886' : '#5B9BEF')}"/>`;
    }
    // the wavefront(s): how far the disturbance has travelled
    const front = (x, dir) => x > x0 && x < x1 ? `<line x1="${x.toFixed(1)}" y1="${y0 - 100}" x2="${x.toFixed(1)}" y2="${y0 + 100}" stroke="#F2704A" stroke-dasharray="3 5"/>` +
      `<path d="M${x.toFixed(1)},${y0 - 108} h${dir * 40}" stroke="#F2704A" stroke-width="2" marker-end="url(#ar)"/><text x="${(x + dir * 6).toFixed(1)}" y="${y0 - 116}" fill="#F2704A" font-size="13" text-anchor="${dir > 0 ? 'start' : 'end'}">${el ? 'μέτωπο' : 'front'}</text>` : '';
    s += front(frontR, 1); if (stand) s += front(frontL, -1);
    if (stand) {
      if (full) {   // nodes (never move) and antinodes, half a wavelength apart
        const n0 = Math.ceil(((x0 - xm) / (la / 2)) - 0.5), n1 = Math.floor(((x1 - xm) / (la / 2)) - 0.5);
        const nodes = []; for (let n = n0; n <= n1; n++) nodes.push(xm + (n + 0.5) * la / 2);
        for (const x of nodes) s += `<circle cx="${x.toFixed(1)}" cy="${y0}" r="6" fill="none" stroke="#e8e2d0" stroke-width="2"/><text x="${x.toFixed(1)}" y="${Math.min(y0 + 2 * A + 20, 288)}" fill="#e8e2d0" font-size="14" text-anchor="middle">${el ? 'Δ' : 'N'}</text>`;
        for (let n = n0; n <= n1 + 1; n++) { const x = xm + n * la / 2; if (x > x0 && x < x1) s += `<text x="${x.toFixed(1)}" y="${Math.min(y0 + 2 * A + 20, 288)}" fill="#62b886" font-size="14" text-anchor="middle">${el ? 'Κ' : 'A'}</text>`; }
        if (nodes.length > 1) { const a1 = nodes[0], a2 = nodes[1], yy = y0 - 2 * A - 20;
          s += `<line x1="${a1.toFixed(1)}" y1="${yy}" x2="${a2.toFixed(1)}" y2="${yy}" stroke="#d9a521" stroke-width="2"/><line x1="${a1.toFixed(1)}" y1="${yy - 7}" x2="${a1.toFixed(1)}" y2="${yy + 7}" stroke="#d9a521"/><line x1="${a2.toFixed(1)}" y1="${yy - 7}" x2="${a2.toFixed(1)}" y2="${yy + 7}" stroke="#d9a521"/>` +
               `<text x="${((a1 + a2) / 2).toFixed(1)}" y="${yy - 8}" fill="#d9a521" font-size="18" text-anchor="middle">λ/2</text>`; }
      }
    } else {
      // λ and A markers on a crest the wave has already reached
      const crestX = x0 + ((w * t - Math.PI / 2) / k % la + la) % la, c2 = crestX + la;
      if (type === 'trans' && c2 < Math.min(x1, frontR)) {
        s += `<line x1="${crestX.toFixed(1)}" y1="${y0 - A - 22}" x2="${c2.toFixed(1)}" y2="${y0 - A - 22}" stroke="#d9a521" stroke-width="2"/>` +
             `<line x1="${crestX.toFixed(1)}" y1="${y0 - A - 30}" x2="${crestX.toFixed(1)}" y2="${y0 - A - 8}" stroke="#d9a521"/><line x1="${c2.toFixed(1)}" y1="${y0 - A - 30}" x2="${c2.toFixed(1)}" y2="${y0 - A - 8}" stroke="#d9a521"/>` +

        if (k1 < frontR) s += `<text x="${k1.toFixed(1)}" y="${y0 + 86}" fill="#d9a521" font-size="15" text-anchor="middle">${el ? 'πύκνωμα' : 'compression'}</text>`;
        if (k2 < Math.min(x1, frontR)) s += `<line x1="${k1.toFixed(1)}" y1="${y0 - 76}" x2="${k2.toFixed(1)}" y2="${y0 - 76}" stroke="#d9a521" stroke-width="2"/>` +
          `<line x1="${k1.toFixed(1)}" y1="${y0 - 84}" x2="${k1.toFixed(1)}" y2="${y0 - 66}" stroke="#d9a521"/><line x1="${k2.toFixed(1)}" y1="${y0 - 84}" x2="${k2.toFixed(1)}" y2="${y0 - 66}" stroke="#d9a521"/>` +

               `<text x="${((X(prev) + X(lastPeak)) / 2).toFixed(1)}" y="${yy - 8}" fill="#d9a521" font-size="18" text-anchor="middle">T</text>`;

  /* ---------- 2D ripple tank, one or two sources ---------- */
  field(fn) {
    const W = 250, H = 140, d = this.img.data;
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const v = fn(i * 4 + 2, j * 4 + 2), o = (j * W + i) * 4;   // v in [-1, 1]
      const c = (v + 1) / 2;
      d[o] = 15 + c * 60; d[o + 1] = 25 + c * 130; d[o + 2] = 45 + c * 210; d[o + 3] = 255;
    }
    this.off.getContext('2d').putImageData(this.img, 0, 0);
    const ctx = this.ctx; ctx.imageSmoothingEnabled = true; ctx.drawImage(this.off, 0, 0, 1000, 560);
  }
  draw2() {
    const {f, v, sx, sy} = this.S.d2, la = v / f, k = TAU / la, w = TAU * f, t = this.t;
    this.field((x, y) => { const r = Math.hypot(x - sx, y - sy); const out = w * t - k * r; return out < 0 ? 0 : Math.sin(out) / Math.sqrt(1 + r / 120); });
    const ctx = this.ctx;

    ctx.strokeStyle = '#F2704A'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, rc), 0, TAU); ctx.stroke();
    ctx.fillStyle = '#d9a521'; ctx.beginPath(); ctx.arc(sx, sy, 7, 0, TAU); ctx.fill();
    const y = sy + 0.0, xa = sx + rc + la, xb = sx + rc + 2 * la;
    if (xb < 990) {
      ctx.strokeStyle = '#d9a521'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(xa, y - 16); ctx.lineTo(xb, y - 16); ctx.stroke();
      ctx.fillStyle = '#d9a521'; ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('λ', (xa + xb) / 2, y - 24);
    }
  }
  draw3() {
    const {f, f2, v, d, ph, show, lines, px, py} = this.S.int, t = this.t;
    const k1 = TAU * f / v, k2 = TAU * f2 / v, w1 = TAU * f, w2 = TAU * f2, la = v / f;
    const s1 = {x: 500 - d / 2, y: 60}, s2 = {x: 500 + d / 2, y: 60}, p2 = ph ? Math.PI : 0, same = Math.abs(f - f2) < 1e-9;
    if (show === 'avg') this.field((x, y) => { const r1 = Math.hypot(x - s1.x, y - s1.y), r2 = Math.hypot(x - s2.x, y - s2.y); return Math.cos(((w1 - w2) * t - k1 * r1 + k2 * r2 - p2) / 2) ** 2 * 2 - 1; });

        ctx.beginPath();

        else { const a = Math.abs(D) / 2, b = Math.sqrt(c * c - a * a), sg = Math.sign(D);
          for (let i = 0; i <= 240; i++) { const u = -5 + 10 * i / 240, x = 500 + sg * a * Math.cosh(u), y = 60 + b * Math.sinh(u); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } }
        ctx.stroke();
      };
      ctx.lineWidth = 2.5;
      for (let m = -40; m <= 40; m++) {
        const Dc = (m - shift) * la, Dd = (m + 0.5 - shift) * la;
        if (Math.abs(Dc) < d - 1) { ctx.setLineDash([]); ctx.strokeStyle = 'rgba(98,184,134,.95)'; hyper(Dc); }
        if (Math.abs(Dd) < d - 1) { ctx.setLineDash([8, 7]); ctx.strokeStyle = 'rgba(242,112,74,.95)'; hyper(Dd); }

      `<path d="${curve(y1)}" fill="none" stroke="#5B9BEF" stroke-width="2" opacity=".8"/><path d="${curve(y2)}" fill="none" stroke="#d9a521" stroke-width="2" opacity=".8"/>` +
      `<path d="${curve(tt => y1(tt) + y2(tt))}" fill="none" stroke="#62b886" stroke-width="3"/>` +
      `<text x="${g1}" y="190" fill="#a09882" font-size="13" text-anchor="end">${page.t.time} →</text>`;

  /* ---------- panels ---------- */
  table() {
