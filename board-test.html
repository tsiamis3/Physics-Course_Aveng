<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Scoreboard test</title>
<style>body{font:16px/1.5 system-ui;max-width:700px;margin:30px auto;padding:0 16px}pre{background:#eee;padding:10px;white-space:pre-wrap}</style></head>
<body><h1>Scoreboard test</h1><p>Open this page from the live site (https://tsiamis3.github.io/Physics-Course_Aveng/board-test.html).</p>
<button id="go">Run test</button><pre id="out">Press the button.</pre>
<script src="scoreboard.js"></script>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out'); out.textContent = 'Page origin: ' + location.origin + '\nWorker: ' + BOARD_URL + '\n\n';
  for (const [m, path, body] of [['POST', '/score', {nick: 'TestBot', lesson: 'test', correct: 1, total: 1}], ['GET', '/top?lesson=test'], ['GET', '/overall']]) {
    try {
      const r = await fetch(BOARD_URL + path, {method: m, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
      out.textContent += m + ' ' + path + ' -> ' + r.status + ' ' + await r.text() + '\n';
    } catch (e) { out.textContent += m + ' ' + path + ' -> FAILED: ' + e.message + ' (CORS blocked or Worker not deployed)\n'; }
  }
};
</script></body></html>
