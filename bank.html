<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics for Aircraft Engineers · Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Barlow Condensed",Impact,sans-serif;letter-spacing:.01em}
header p{margin:6px 0 0;color:#b9c6d0;max-width:60ch}
nav{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:underline;text-underline-offset:3px}
main{display:grid;grid-template-columns:300px 1fr;gap:20px;max-width:1150px;margin:20px auto;padding:0 16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
aside,.card{background:var(--panel);border:1px solid var(--line);border-radius:6px}
aside{padding:16px;align-self:start}
aside h2{font:700 20px "Barlow Condensed",sans-serif;margin:16px 0 6px}
aside h2:first-child{margin-top:0}
label{display:block;font-size:15px;color:var(--mute)}
input,select,button{font:inherit;color:inherit}
input[type=search],input[type=number],select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff}
.row{display:flex;gap:8px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font-weight:600;background:var(--blue);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.go{background:var(--amber);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.bar .count{margin-right:auto;color:var(--mute)}
.card{padding:16px 18px;margin-bottom:14px}
.meta{font-size:14px;color:var(--mute);margin-bottom:4px}
.q{font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:#e3f3ea;border-color:var(--ok)}
.opt.bad{background:#fbe6e4;border-color:var(--bad)}
.expl{margin:8px 0 0;padding:8px 10px;border-left:4px solid var(--amber);background:#fff7e0}
.tags{margin-top:10px;font-size:14px;color:var(--mute)}
.opt.sel{border-color:var(--blue);background:#e3edf6}.rep{margin-left:10px}
.empty{padding:30px;text-align:center;color:var(--mute)}
#score{font-weight:700}
@media print{aside,.bar,header nav{display:none}main{display:block}.card{break-inside:avoid}}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header>
  <h1>Physics for Aircraft Engineers</h1>
  <p>Question bank for the course. Filter by topic, keyword and units, or build a random quiz.</p>
  <nav id="links"></nav>
</header>
<main>
  <aside>
    <h2>Search</h2>
    <input id="search" type="search" placeholder="Search question text">
    <h2>Filters</h2>
    <label>Topic<select id="topic"></select></label>
    <label>Difficulty<select id="difficulty"><option value="">All</option><option>easy</option><option>hard</option></select></label>
    <label>Type<select id="qtype"><option value="">All</option><option>theory</option><option>calculation</option></select></label>
    <label>Units<select id="units"><option value="">All</option><option>imperial</option><option>SI</option></select></label>
    <label>Reviewed<select id="rev"><option value="">All</option><option value="1">Reviewed only</option></select></label>
    <h2>Keywords <button class="chip" id="clearKw" type="button">clear</button></h2>
    <div class="chips" id="kw"></div>
    <h2>Quiz</h2>
    <div class="row">
      <label style="flex:1">Questions<input id="n" type="number" min="1" max="100" value="10"></label>
      <button class="btn go" id="make" type="button">Random quiz</button>
    </div>
    <label style="margin-top:8px"><input type="checkbox" id="exam"> Exam mode (answers at the end)</label>
    <div class="chips" style="margin-top:8px"><button class="btn alt" id="share" type="button">Copy quiz link</button><button class="btn alt" id="retry" type="button">Retry my mistakes</button></div>
    <h2 id="aiH" hidden>AI generator</h2>
    <button class="btn alt" id="ai" type="button" hidden>Generate with AI</button>
  </aside>
  <section>
    <div class="bar">
      <span class="count" id="count"></span>
      <span id="score"></span>
      <button class="btn go" id="finish" type="button" hidden>Finish &amp; score</button>
      <button class="btn alt" id="reset" type="button">Show all</button>
      <button class="btn alt" id="print" type="button">Print</button>
    </div>
    <div id="list" aria-live="polite"></div>
  </section>
</main>
<script src="questions.js"></script>
<script src="mathfmt.js"></script>
<script>
// ---- Configuration: edit these two lines to update the site ----
const CONFIG = {
  AI_ENDPOINT: '',                     // set to your agent/proxy URL to enable "Generate with AI"
  REPORT_URL: '',                       // e.g. 'https://github.com/USER/REPO/issues/new' (or use REPORT_EMAIL)
  REPORT_EMAIL: '',
  LINKS: [                              // course material links shown in the header
    {label: 'Home', href: 'index.html'},
    {label: 'Unit conversions', href: 'units.html'},
    {label: 'Simulations', href: 'simulations.html'},
    {label: 'Materials', href: 'materials.html'},
    {label: 'Formula sheet', href: 'formula.html'},
    {label: 'Slides (Google Drive)', href: '#'},
    {label: 'GitHub repo', href: '#'}
  ]
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

// Holds all state: question pool, filters, current quiz and score.
class QuizApp {
  constructor(cfg) {
    this.cfg = cfg;
    this.pool = [];
    this.kw = new Set();
    this.quiz = null;      // array of prepared questions when a random quiz is active
    this.answered = {};    // id -> true/false
    this.showAllKw = false;
    this.exam = false; this.done = false; this.picks = {}; this.seed = 0; this.rng = Math.random;
    this.wrong = this.load();
  }

  async init() {
    $('links').innerHTML = this.cfg.LINKS.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
    this.pool = window.QUESTIONS || [];
    if (!this.pool.length) { $('list').innerHTML = '<p class="empty">questions.js is missing or empty.</p>'; return; }
    if (this.cfg.AI_ENDPOINT) { $('ai').hidden = false; $('aiH').hidden = false; }
    this.bind();
    this.refreshFilters();
    this.render();
    this.applyHash();
  }

  bind() {
    ['search', 'topic', 'difficulty', 'units', 'qtype', 'rev'].forEach(id => $(id).addEventListener('input', () => { this.quiz = null; this.render(); }));
    $('clearKw').onclick = () => { this.kw.clear(); this.quiz = null; this.refreshFilters(); this.render(); };
    $('make').onclick = () => this.makeQuiz();
    $('reset').onclick = () => { this.quiz = null; this.answered = {}; this.render(); };
    $('print').onclick = () => window.print();
    $('share').onclick = () => this.share();
    $('retry').onclick = () => this.retry();
    $('finish').onclick = () => this.finish();
    $('exam').onchange = () => { this.quiz = null; this.render(); };
    $('ai').onclick = () => this.generateAI();
  }

  refreshFilters() {
    const topics = [...new Set(this.pool.map(q => q.topic))].sort();
    const cur = $('topic').value;
    $('topic').innerHTML = '<option value="">All</option>' + topics.map(t => `<option>${esc(t)}</option>`).join('');
    $('topic').value = cur;
    const counts = {};
    this.pool.forEach(q => q.keywords.forEach(k => counts[k] = (counts[k] || 0) + 1));
    const all = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    const shown = this.showAllKw ? all : all.filter((k, i) => i < 20 || this.kw.has(k));   // top 20 + any selected
    $('kw').innerHTML = shown.map(k =>
      `<button class="chip" type="button" aria-pressed="${this.kw.has(k)}" data-k="${esc(k)}">${esc(k)} ${counts[k]}</button>`).join('') +
      (all.length > 20 ? `<button class="chip" id="kwMore" type="button">${this.showAllKw ? 'show fewer' : 'show all ' + all.length}</button>` : '');
    $('kw').querySelectorAll('.chip[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      this.kw.has(k) ? this.kw.delete(k) : this.kw.add(k);
      this.quiz = null; this.refreshFilters(); this.render();
    });
    if ($('kwMore')) $('kwMore').onclick = () => { this.showAllKw = !this.showAllKw; this.refreshFilters(); };
  }

  filtered() {
    const s = $('search').value.trim().toLowerCase(), t = $('topic').value, d = $('difficulty').value, u = $('units').value, ty = $('qtype').value;
    return this.pool.filter(q =>
      (!t || q.topic === t) && (!d || q.difficulty === d) && (!u || q.units === u) && (!ty || q.type === ty) && (!$('rev').value || q.reviewed === true) &&
      [...this.kw].every(k => q.keywords.includes(k)) &&
      (!s || (q.question + ' ' + q.keywords.join(' ')).toLowerCase().includes(s)));
  }

  // Random subset of the filtered pool, with options shuffled.
  makeQuiz(seed) {
    const n = Math.max(1, parseInt($('n').value) || 10);
    this.seed = seed || Math.floor(Math.random() * 1e9);
    this.rng = this.mulberry(this.seed);
    this.exam = $('exam').checked;
    const picked = this.shuffle(this.filtered().slice().sort((a, b) => a.id < b.id ? -1 : 1)).slice(0, n);
    this.quiz = picked.map(q => {
      const opts = this.shuffle(q.options.map((text, i) => ({text, correct: i === q.answer})));
      return {...q, opts};
    });
    this.answered = {};
    this.render();
  }

  shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  load() { try { return new Set(JSON.parse(localStorage.getItem('physq-wrong') || '[]')); } catch (e) { return new Set(); } }
  record(q, ok) { ok ? this.wrong.delete(q.id) : this.wrong.add(q.id); try { localStorage.setItem('physq-wrong', JSON.stringify([...this.wrong])); } catch (e) {} }

  // Shareable quiz: filters + seed in the URL hash, so everyone gets the same questions.
  share() {
    if (!this.quiz) this.makeQuiz();
    const p = new URLSearchParams({seed: this.seed, n: $('n').value, exam: this.exam ? 1 : 0});
    ['search', 'topic', 'difficulty', 'units', 'qtype', 'rev'].forEach(id => { if ($(id).value) p.set(id, $(id).value); });
    if (this.kw.size) p.set('kw', [...this.kw].join('|'));
    const url = location.href.split('#')[0] + '#' + p;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => alert('Quiz link copied'), () => prompt('Copy this link:', url));
  }
  applyHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const filters = ['search', 'topic', 'difficulty', 'units', 'qtype', 'rev'];
    if (!p.get('seed') && !filters.some(id => p.get(id)) && !p.get('kw')) return;   // links from Home can set filters only (no quiz)
    filters.forEach(id => { if (p.get(id)) $(id).value = p.get(id); });
    this.kw = new Set((p.get('kw') || '').split('|').filter(Boolean));
    $('n').value = p.get('n') || 10; $('exam').checked = p.get('exam') === '1';
    this.refreshFilters();
    if (p.get('seed')) this.makeQuiz(+p.get('seed')); else this.render();
  }
  retry() {
    const qs = this.pool.filter(q => this.wrong.has(q.id));
    if (!qs.length) return alert('No saved mistakes yet.');
    this.quiz = qs.map(q => ({...q, opts: this.shuffle(q.options.map((text, i) => ({text, correct: i === q.answer})))}));
    this.exam = false; this.render();
  }
  finish() {   // exam mode: score everything at once
    this.done = true; $('finish').hidden = true;
    this.quiz.forEach((q, n) => this.answer(q, this.picks[q.id] === undefined ? -1 : this.picks[q.id], $('list').children[n]));
  }
  reportLink(q) {
    const t = encodeURIComponent('Question ' + q.id + ': possible error'), b = encodeURIComponent('Question ' + q.id + ': ' + q.question + '\n\nWhat is wrong?\n');
    const href = this.cfg.REPORT_URL ? `${this.cfg.REPORT_URL}?title=${t}&body=${b}` : this.cfg.REPORT_EMAIL ? `mailto:${this.cfg.REPORT_EMAIL}?subject=${t}&body=${b}` : '';
    return href ? `<a class="rep" href="${esc(href)}" target="_blank" rel="noopener">Report an error</a>` : '';
  }

  async generateAI() {
    const body = {topic: $('topic').value, difficulty: $('difficulty').value, units: $('units').value || 'imperial', type: $('qtype').value,
                  keywords: [...this.kw], count: Math.min(10, parseInt($('n').value) || 5)};
    $('ai').disabled = true; $('ai').textContent = 'Generating…';
    try {
      const res = await fetch(this.cfg.AI_ENDPOINT, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      const data = await res.json();               // expected: {questions: [ ...same schema as questions.json ]}
      const fresh = (data.questions || []).map((q, i) => ({...q, id: 'AI' + Date.now() + i, keywords: [...(q.keywords || []), 'AI-generated']}));
      this.pool.push(...fresh);
      this.quiz = null; this.refreshFilters(); this.render();
    } catch (e) {
      alert('AI generation failed: ' + e.message);
    }
    $('ai').disabled = false; $('ai').textContent = 'Generate with AI';
  }

  answer(q, i, card) {
    if (this.answered[q.id] !== undefined) return;
    const opts = q.opts || q.options.map((text, k) => ({text, correct: k === q.answer}));
    if (this.quiz && this.exam && !this.done) {   // exam mode: remember the pick, reveal nothing yet
      this.picks[q.id] = i;
      card.querySelectorAll('.opt').forEach((b, k) => b.classList.toggle('sel', k === i));
      return;
    }
    this.answered[q.id] = i >= 0 && opts[i].correct;
    this.record(q, this.answered[q.id]);
    card.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true;
      if (opts[k].correct) b.classList.add('ok');
      else if (k === i) b.classList.add('bad');
    });
    card.querySelector('.expl').hidden = false;
    this.renderScore();
  }

  renderScore() {
    const done = Object.keys(this.answered).length, right = Object.values(this.answered).filter(Boolean).length;
    $('score').textContent = done ? `Score: ${right} / ${done}` : '';
  }

  render() {
    this.answered = {}; this.picks = {}; this.done = false;
    $('finish').hidden = !(this.quiz && this.exam);
    const list = this.quiz || this.filtered();
    $('count').textContent = this.quiz ? `Quiz: ${list.length} questions` : `${list.length} of ${this.pool.length} questions`;
    this.renderScore();
    if (!list.length) { $('list').innerHTML = '<p class="empty">No questions match these filters. Remove a keyword or change a filter.</p>'; return; }
    $('list').innerHTML = '';
    list.forEach((q, n) => {
      const opts = q.opts || q.options.map((text, k) => ({text, correct: k === q.answer}));
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<div class="meta">${esc(q.topic)} · ${esc(q.difficulty)} · ${esc(q.units)}${q.type ? ' · ' + esc(q.type) : ''}</div>
        <p class="q">${this.quiz ? (n + 1) + '. ' : ''}${mfmt(q.question)}</p>
        ${opts.map((o, k) => `<button class="opt" type="button">${'ABCD'[k]}) ${mfmt(o.text)}</button>`).join('')}
        <p class="expl" hidden>${mfmt(q.explanation || '')}</p>
        <div class="tags">${q.keywords.map(esc).join(', ')} ${this.reportLink(q)}</div>`;
      card.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => this.answer(q, k, card));
      $('list').appendChild(card);
    });
  }
}

new QuizApp(CONFIG).init();
</script>
</body>
</html>
