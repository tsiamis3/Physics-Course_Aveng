<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics for Aircraft Engineers · My profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Barlow Condensed",Impact,sans-serif}
header p{margin:6px 0 0;color:#b9c6d0;max-width:60ch}
nav{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:underline;text-underline-offset:3px}
main{max-width:900px;margin:20px auto;padding:0 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 8px}
.meta,.note{color:var(--mute);font-size:15px}
.btn{display:inline-block;border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;background:var(--blue);color:#fff;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.go{background:var(--amber);color:var(--ink)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 12px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:inherit;width:100%;max-width:220px}
label{display:block;font-size:15px;color:var(--mute);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.err{color:var(--bad);min-height:1.4em;margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--field,#fff);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.tile b{display:block;font:700 30px/1.1 "Barlow Condensed",sans-serif}
.tile span{font-size:14px;color:var(--mute)}
.tb{display:grid;grid-template-columns:minmax(0,230px) 1fr 86px;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.tb .bar{height:10px;background:var(--line);position:relative}.tb .bar i{display:block;height:100%;background:var(--blue)}
.tb .bar i.weak{background:var(--bad)}.tb .bar i.good{background:var(--ok)}
.tb small{color:var(--mute)}
@media(max-width:560px){.tb{grid-template-columns:1fr 1fr}.tb .bar{grid-column:1/3;order:3}}
.trend{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);position:relative;padding-top:6px}
.trend i{flex:1;max-width:28px;background:var(--blue);min-height:2px}.trend i.pass{background:var(--ok)}.trend i.pr{background:var(--mute)}
.trend .line{position:absolute;left:0;right:0;border-top:2px dashed var(--amber);pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.mis{margin:4px 0}.mis .en{display:block;color:var(--mute);font-size:.9em}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header>
  <h1>Physics for Aircraft Engineers</h1>
  <p>Your profile: results, strong and weak chapters and the mistakes you repeat.</p>
  <nav id="links"></nav>
</header>
<main id="main"></main>
<script src="m2meta.js"></script>
<script src="scoreboard.js"></script>
<script>
const CONFIG = {
  LINKS: [
    {label: 'Home', href: 'index.html'},
    {label: 'Test builder', href: 'test.html'},
    {label: 'Formula sheet', href: 'formula.html'},
    {label: 'Unit conversions', href: 'units.html'}
  ],
  PASS: 0.75,          // pass mark, same as test.html
  WEAK: 0.6,           // a chapter under this share (with at least MIN answers) is marked weak
  MIN: 5
};

const $ = id => document.getElementById(id);
const esc = Board.esc;
const pc = (c, n) => n ? Math.round(c / n * 100) : 0;

class ProfilePage {
  constructor(board, meta, cfg) { this.b = board; this.meta = meta; this.cfg = cfg; this.misc = null; this.lang = 'both'; }

  tname(t) { const i = this.meta.topics[t]; return i ? i.en : t; }

  // ---------- logged out ----------
  renderAuth(mode) {
    const reg = mode === 'register';
    $('main').innerHTML = `<section><h2>${reg ? 'Create a profile' : 'Log in'}</h2>
      <p class="note">${reg
        ? 'Choose a nickname and a PIN of 4 to 6 digits. Your results are then saved on any device you log in from. Do not use a PIN you use anywhere else. There is no PIN recovery.'
        : 'Enter your nickname and PIN.'}</p>
      <form id="f" autocomplete="on">
        <label for="nick">Nickname</label><input id="nick" maxlength="16" autocomplete="username" value="${esc(this.b.nick)}">
        <label for="pin">PIN (4 to 6 digits)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}">
        <div class="row"><button class="btn go" id="go" type="submit">${reg ? 'Create profile' : 'Log in'}</button>
        <button class="btn alt" id="sw" type="button">${reg ? 'I already have a profile' : 'Create a new profile'}</button></div>
        <p class="err" id="err" role="alert"></p></form></section>`;
    $('sw').onclick = () => this.renderAuth(reg ? 'login' : 'register');
    $('f').onsubmit = async e => {
      e.preventDefault();
      const nick = $('nick').value.trim(), pin = $('pin').value;
      if (!Board.valid(nick)) { $('err').textContent = 'Nickname: 2 to 16 letters, digits, spaces, - or _.'; return; }
      if (!/^\d{4,6}$/.test(pin)) { $('err').textContent = 'The PIN must be 4 to 6 digits.'; return; }
      $('go').disabled = true; $('err').textContent = 'Please wait…';
      const err = await (reg ? this.b.register(nick, pin) : this.b.login(nick, pin));
      if (err) { $('err').textContent = err; $('go').disabled = false; } else this.init();
    };
  }

  // ---------- logged in ----------
  async renderProfile() {
    $('main').innerHTML = '<section><p class="note">Loading…</p></section>';
    const r = await this.b.me();
    if (r.status === 401) return this.renderAuth('login');
    if (!r.ok) { $('main').innerHTML = `<section><h2>Profile</h2><p class="err">${esc(r.data.error || 'Could not load the profile.')}</p><button class="btn" onclick="location.reload()">Try again</button></section>`; return; }
    const s = r.data.stats, nick = r.data.nick;
    const tests = s.tests.filter(t => t.m === 'test');
    const best = tests.length ? Math.max(...tests.map(t => pc(t.ok, t.n))) : null;
    const passed = tests.filter(t => t.ok / t.n >= this.cfg.PASS).length;
    const days = s.days || [], streak = this.streak(days);
    const secs = s.tests.reduce((a, t) => a + t.s, 0);

    const topics = Object.keys(s.topics).sort((a, b) => pc(s.topics[a].c, s.topics[a].n) - pc(s.topics[b].c, s.topics[b].n) || s.topics[b].n - s.topics[a].n);
    const weak = topics.filter(t => s.topics[t].n >= this.cfg.MIN && s.topics[t].c / s.topics[t].n < this.cfg.WEAK);
    const tagIds = Object.keys(s.tags).sort((a, b) => s.tags[b] - s.tags[a]).slice(0, 8);

    const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
    const bars = topics.map(t => {
      const a = s.topics[t], p = pc(a.c, a.n), cls = a.n >= this.cfg.MIN ? (a.c / a.n < this.cfg.WEAK ? 'weak' : a.c / a.n >= this.cfg.PASS ? 'good' : '') : '';
      return `<div class="tb"><span>${esc(this.tname(t))}</span><div class="bar"><i class="${cls}" style="width:${p}%"></i></div><span>${p} % <small>${a.c}/${a.n}</small></span></div>`;
    }).join('');
    const last = s.tests.slice(-20);
    const trend = last.map(t => { const p = pc(t.ok, t.n); return `<i class="${t.m === 'practice' ? 'pr' : t.ok / t.n >= this.cfg.PASS ? 'pass' : ''}" style="height:${Math.max(p, 2)}%" title="${p} % · ${t.ok}/${t.n} · ${t.m}"></i>`; }).join('');
    const hist = s.tests.slice(-10).reverse().map(t => `<tr><td>${new Date(t.t).toLocaleDateString()}</td><td>${t.m === 'test' ? 'Timed test' : 'Practice'}</td><td>${t.ok}/${t.n}</td><td>${pc(t.ok, t.n)} %</td><td>${Math.floor(t.s / 60)} min</td></tr>`).join('');
    const total = s.total;
    const hash = weak.length ? '#' + new URLSearchParams({topic: weak.slice(0, 3).join(','), mode: 'practice', n: 20, go: 1}) : '';

    $('main').innerHTML = `
      <section><div class="row" style="justify-content:space-between;margin:0"><div><h2 style="margin:0">${esc(nick)}</h2>
        <span class="meta">Member since ${new Date(r.data.created).toLocaleDateString()}</span></div>
        <button class="btn alt" id="out" type="button">Log out</button></div></section>
      ${total.n ? '' : '<section><p>No results yet. Do a practice or timed test in the <a href="test.html">Test builder</a> while logged in and your numbers appear here.</p></section>'}
      <section><h2>Overview</h2><div class="tiles">
        ${tile(total.n, 'questions answered')}${tile(pc(total.c, total.n) + ' %', 'overall accuracy')}
        ${tile(tests.length, 'timed tests')}${tile(best === null ? '–' : best + ' %', 'best timed test')}
        ${tile(passed, 'timed tests passed (' + Math.round(this.cfg.PASS * 100) + ' %)')}${tile(days.length, 'days practised')}
        ${tile(streak, 'current streak (days)')}${tile(Math.round(secs / 60), 'minutes spent')}</div></section>
      ${topics.length ? `<section><h2>By chapter</h2><p class="note">Weakest first. Red = under ${Math.round(this.cfg.WEAK * 100)} % (at least ${this.cfg.MIN} answers), green = at or above the pass mark.</p>${bars}
        ${hash ? `<div class="row"><a class="btn go" href="test.html${hash}">Practise my ${Math.min(3, weak.length)} weakest chapter${weak.length > 1 ? 's' : ''}</a></div>` : ''}</section>` : ''}
      ${last.length ? `<section><h2>Recent sessions</h2><p class="note">Last ${last.length}. Green = timed test passed, amber/blue = timed test not passed, grey = practice. Dashed line = pass mark.</p>
        <div class="trend">${trend}<span class="line" style="bottom:${this.cfg.PASS * 100}%"></span></div>
        <table><tr><th>Date</th><th>Type</th><th>Score</th><th>%</th><th>Time</th></tr>${hist}</table></section>` : ''}
      ${tagIds.length ? `<section><h2>Mistakes you repeat</h2><div id="mis"><p class="note">Loading…</p></div></section>` : ''}`;
    $('out').onclick = async () => { await this.b.logout(); this.init(); };
    if (tagIds.length) this.renderMistakes(tagIds, s.tags);
  }

  streak(days) {
    if (!days.length) return 0;
    const d = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
    const today = new Date().toISOString().slice(0, 10);
    if ((d(today) - d(days[days.length - 1])) / 864e5 > 1) return 0;
    let n = 1; for (let i = days.length - 1; i > 0; i--) { if ((d(days[i]) - d(days[i - 1])) / 864e5 === 1) n++; else break; }
    return n;
  }

  // The names of the mistakes live in the question bank file, which the Test builder already caches. Load it only when needed.
  loadMisc() {
    if (this.misc) return Promise.resolve(this.misc);
    if (window.M2_BANK) return Promise.resolve(this.misc = window.M2_BANK.misc || {});
    return new Promise(res => { const sc = document.createElement('script'); sc.src = 'm2bank.js';
      sc.onload = () => res(this.misc = (window.M2_BANK && window.M2_BANK.misc) || {}); sc.onerror = () => res(this.misc = {}); document.head.appendChild(sc); });
  }
  async renderMistakes(ids, counts) {
    const misc = await this.loadMisc();
    $('mis').innerHTML = ids.map(t => { const m = misc[t];
      return `<p class="mis"><b>${counts[t]}×</b> ${m ? esc(m.en) + (m.el && m.el !== m.en ? `<span class="en">${esc(m.el)}</span>` : '') : esc(t)}</p>`; }).join('');
  }

  init() {
    $('links').innerHTML = this.cfg.LINKS.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
    if (!this.b.url) { $('main').innerHTML = '<section><h2>Profiles are off</h2><p class="note">The shared server is not configured (BOARD_URL in scoreboard.js is empty).</p></section>'; return; }
    this.b.loggedIn ? this.renderProfile() : this.renderAuth('login');
  }
}
new ProfilePage(board, window.M2_META, CONFIG).init();
</script>
</body>
</html>
