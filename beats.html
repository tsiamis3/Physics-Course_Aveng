  st0: 'Ίδιες συχνότητες: τα κύματα μένουν συνεχώς στην ίδια φάση. Η ένταση είναι σταθερή, δεν υπάρχει διακρότημα.',

  stLow: 'Οι συχνότητες είναι πολύ χαμηλές για να ακουστούν από ηχεία. Εδώ το σχήμα δείχνει το διακρότημα σε αργή κίνηση: φαίνεται κάθε ταλάντωση ξεχωριστά.',
  stAmp: 'Με άνισα πλάτη η ακύρωση δεν είναι πλήρης: ο ήχος δεν σβήνει τελείως, απλώς χαμηλώνει.',

  noAudio: 'Ο browser δεν υποστηρίζει ήχο (Web Audio).',

 },
 en: {
  h1: 'Beats', sub: 'Two sounds of slightly different frequency interfere. The sound we hear swells and fades as many times per second as the difference of the frequencies.',
  title: 'Two sources, two frequencies', soundOn: '🔊 Sound: ON', soundOff: '🔇 Sound: OFF', play: '❚❚ Pause', pause: '▶ Play', reset: '↺ Restart',
  calc: 'What is happening', ctl: 'Settings',
  f1: 'Frequency of source 1', f2: 'Frequency of source 2', df: 'Fine tuning of f₂', a2: 'Amplitude of source 2', vol: 'Speaker volume',
  on1: 'Hear source 1', on2: 'Hear source 2',
  presets: 'Ready examples:', pre: {tune: 'Tuning 440 / 442', fast: 'Fast 440 / 450', same: 'Equal 440 / 440', slow: 'Slow motion 6 / 7', half: 'Unequal amplitudes', oct: 'Octave 1:2 (440 / 880)', fifth: 'Fifth 2:3 (440 / 660)', fourth: 'Fourth 3:4 (330 / 440)', third: 'Major third 4:5 (440 / 550)', off: 'Out-of-tune fifth (440 / 663)'},
  ratio: 'Ratio f₂ : f₁', rep: 'The sum repeats every', noRep: 'does not repeat exactly', far: 'two tones together (a chord)',
  iv: {'1:1': 'unison', '2:1': 'octave', '3:2': 'perfect fifth', '4:3': 'perfect fourth', '5:4': 'major third', '6:5': 'minor third', '5:3': 'major sixth', '8:5': 'minor sixth', '9:8': 'major second', '15:8': 'major seventh', '3:1': 'octave + fifth', '4:1': 'two octaves'},
  stFar: 'The frequencies are far apart: we hear no beats but two separate tones together.',
  stRat: (r, n, T) => `The ratio is ${r}${n ? ' (' + n + ')' : ''}: the sum takes the same shape again every ${T}. The simpler the ratio (1:2, 2:3, 3:4), the sooner it repeats and the more "consonant" the pair sounds.`,
  stNoRat: 'The ratio is not simple: the shape of the sum keeps changing. Use the fine tuning to lock onto 2:3 or 1:2 and watch the shape settle.',
  rows: {f1: 'Frequency of source 1, f₁', f2: 'Frequency of source 2, f₂', fb: 'Beat frequency f_b = |f₁ − f₂|', Tb: 'Beat period T_b = 1/f_b', tone: 'Pitch heard ≈ (f₁ + f₂)/2', win: 'Time shown in the top graph'},
  none: 'none', inf: '∞ (steady loudness)',
  top: 'Sum of the two waves against time', zoom: 'Close-up at the red line',

  loud: 'loudness', env: 'envelope',
  legend: ['Wave from source 1', 'Wave from source 2', 'Sum (what reaches the ear)', 'Envelope: how the loudness changes', 'Now (in step with the sound)'],
  hint: 'Press "Sound" and first listen to each source on its own, then to both. The lower graph shows why: wave 2 slowly slides past wave 1, so they are sometimes in phase and sometimes in opposite phase.',

  st1: n => `The sound swells and fades ${n} times per second.`,
  stFast: 'The beats are so fast that they are hard to tell apart one by one: the sound is heard as "rough".',
  stLow: 'These frequencies are too low to come out of a speaker. Here the picture shows beats in slow motion: every oscillation can be seen.',
  stAmp: 'With unequal amplitudes the cancellation is not complete: the sound never dies away, it only gets quieter.',
  stTune: 'As the frequencies get closer the beats slow down. When they stop, the two sources have the same frequency: this is how instruments are tuned.',
  noAudio: 'This browser does not support sound (Web Audio).',

};

const page = new SimPage(T);
const Q = (el, en) => ({el, en});
const fl = (x, d, l) => page.fmtIn(x, d, l);
const V = (x, u, d = 2) => Q(fl(x, d, 'el') + (u ? ' ' + u : ''), fl(x, d, 'en') + (u ? ' ' + u : ''));

/* f1 slider is logarithmic: 2 Hz … 1000 Hz */
const F_MIN = 2, F_MAX = 1000;
const sl2f = v => { const f = F_MIN * Math.pow(F_MAX / F_MIN, v / 1000); return f < 20 ? Math.round(f * 2) / 2 : Math.round(f); };
const f2sl = f => Math.round(1000 * Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN));
const F2_MAX = 2000;                                     // source 2 goes up to two octaves above 500 Hz
const sl2g = v => { const f = F_MIN * Math.pow(F2_MAX / F_MIN, v / 1000); return f < 20 ? Math.round(f * 2) / 2 : Math.round(f); };
const g2sl = f => Math.round(1000 * Math.log(f / F_MIN) / Math.log(F2_MAX / F_MIN));
// Simplest ratio p:q (both up to 9) that matches f2/f1 within 0.3 %, or null.
function ratio(f1, f2) {
  for (let s = 2; s <= 18; s++) for (let q = 1; q < s; q++) { const p = s - q; if (p > 9 || q > 9) continue;
    let g = (a, b) => b ? g(b, a % b) : a; if (g(p, q) !== 1) continue;
    if (Math.abs(f2 / f1 - p / q) < 0.003 * p / q) return {p, q}; }
  return Math.abs(f2 - f1) < 1e-9 ? {p: 1, q: 1} : null;
}

/* ============================ geometry ============================ */
const X0 = 70, X1 = 900, TOP_Y = 162, TOP_H = 92, Z_Y = 440, Z_H = 52, BAR_X = 945;
const C1 = '#5B9BEF', C2 = '#F2A64A', CS = '#e8e2d0', CE = '#62b886', CH = '#F2704A';

class BeatsPage {
  constructor() {
    this.S = {f1: 440, f2: 442, f2c: 442, df: 0, a2: 1, on1: true, on2: true, vol: 0.5};
    this.running = true; this.t = 0; this.win = -1;
    this.ctx = null; this.osc = null; this.soundOn = false;
    page.bindLang($('lang-el'), $('lang-en'));
    page.onLang(() => this.texts());
    $('f1').addEventListener('input', () => { this.S.f1 = sl2f(+$('f1').value); this.changed(true); });
    $('f2').addEventListener('input', () => { this.S.f2c = sl2g(+$('f2').value); this.syncF2(); this.changed(true); });
    $('df').addEventListener('input', () => { this.S.df = +$('df').value; this.syncF2(); this.changed(true); });
    $('a2').addEventListener('input', () => { this.S.a2 = +$('a2').value / 100; this.changed(false); });
    $('vol').addEventListener('input', () => { this.S.vol = +$('vol').value / 100; this.gains(); this.outputs(); });
    for (const k of ['on1', 'on2']) $(k).addEventListener('change', () => { this.S[k] = $(k).checked; this.gains(); });
    $('sound').onclick = () => this.toggleSound();
    $('play').onclick = () => { this.running = !this.running; if (this.ctx) this.running ? this.ctx.resume() : this.ctx.suspend(); this.texts(); };
    $('reset').onclick = () => this.restart();
    this.quiz = new Quiz(page, $('quiz'), QUIZ, {topics: ['waves'], tpls: ['waves.beats']});
    this.sliders();
    this.texts();
    this.quiz.next();
    this.last = performance.now();
    requestAnimationFrame(t => this.tick(t));
  }

  /* ---------- state ---------- */
  syncF2() { this.S.f2 = Math.max(0.5, Math.round((this.S.f2c + this.S.df) * 2) / 2); }
  sliders() {
    $('f1').value = f2sl(this.S.f1); $('f2').value = g2sl(this.S.f2c); $('df').value = this.S.df; this.syncF2();
    $('a2').value = Math.round(this.S.a2 * 100); $('on1').checked = this.S.on1; $('on2').checked = this.S.on2;
  }
  set(v) { if (v.f2 !== undefined) { v = Object.assign({f2c: v.f2, df: 0}, v); } Object.assign(this.S, v); this.sliders(); this.changed(true); }
  changed(freq) {
    if (freq) this.restart(); else { this.win = -1; this.gains(); }
    this.table();
  }
  get fb() { return Math.abs(this.S.f1 - this.S.f2); }
  // Close frequencies give beats; far apart they are heard as two tones (an interval).
  get beats() { const {f1, f2} = this.S; return this.fb < 25 && this.fb <= 0.2 * Math.min(f1, f2); }
  get rat() { return ratio(this.S.f1, this.S.f2); }
  get Trep() { const r = this.rat; return r ? r.q / this.S.f1 : 0; }      // the sum repeats after q cycles of f1
  get Tw() {                         // length of the top graph
    const fb = this.fb, f1 = this.S.f1;
    if (!this.beats) return Math.min(6, Math.max(0.004, this.Trep ? Math.max(3 * this.Trep, 6 / f1) : 12 / f1));
    let w = fb > 0 ? 3 / fb : 12 / f1 > 0.2 ? 12 / f1 : 0.2;
    if (fb > 0 && w > 6) w = 1 / fb;
    return Math.min(6, Math.max(0.06, w));
  }

  /* ---------- sound ---------- */
  toggleSound() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { $('status').textContent = page.t.noAudio; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0; this.master.connect(this.ctx.destination);
    }
    this.soundOn = !this.soundOn;
    if (this.soundOn) { this.ctx.resume(); if (!this.running) { this.running = true; } this.restart(); }
    else this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.02);
    this.texts();
  }
  gains() {
    if (!this.osc) return;
    const c = this.ctx.currentTime, k = 0.25;
    this.osc.g1.gain.setTargetAtTime(this.S.on1 ? k : 0, c, 0.015);
    this.osc.g2.gain.setTargetAtTime(this.S.on2 ? k * this.S.a2 : 0, c, 0.015);
    this.master.gain.setTargetAtTime(this.soundOn ? this.S.vol : 0, c, 0.02);
  }
  // Start both tones together, so that the picture and the sound share one clock.
  restart() {
    this.t = 0; this.win = -1;
    if (!this.ctx || !this.soundOn) return;
    const c = this.ctx, now = c.currentTime, start = now + 0.04;
    if (this.osc) {
      const o = this.osc; o.g1.gain.setTargetAtTime(0, now, 0.008); o.g2.gain.setTargetAtTime(0, now, 0.008);
      o.o1.stop(start); o.o2.stop(start);
    }
    const mk = f => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = 0; o.connect(g); g.connect(this.master); o.start(start); return [o, g]; };
    const [o1, g1] = mk(this.S.f1), [o2, g2] = mk(this.S.f2);
    this.osc = {o1, g1, o2, g2}; this.t0 = start;
    const k = 0.25;
    g1.gain.setValueAtTime(0, start); g1.gain.linearRampToValueAtTime(this.S.on1 ? k : 0, start + 0.015);
    g2.gain.setValueAtTime(0, start); g2.gain.linearRampToValueAtTime(this.S.on2 ? k * this.S.a2 : 0, start + 0.015);
    this.master.gain.setTargetAtTime(this.S.vol, now, 0.02);
  }

  /* ---------- loop ---------- */
  tick(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    if (this.soundOn && this.ctx && this.osc) this.t = Math.max(0, this.ctx.currentTime - this.t0);
    else if (this.running) this.t += dt;
    this.draw();
    requestAnimationFrame(t => this.tick(t));
  }

  y(t) { const {f1, f2, a2} = this.S; return Math.sin(2 * Math.PI * f1 * t) + a2 * Math.sin(2 * Math.PI * f2 * t); }
  env(t) { const {f1, f2, a2} = this.S; return Math.sqrt(Math.max(0, 1 + a2 * a2 + 2 * a2 * Math.cos(2 * Math.PI * (f1 - f2) * t))); }

  // Top graph: one window of the summed signal. Drawn as a band of min/max per pixel,
  // so that even 1000 Hz looks right (the carrier fills the envelope).
  drawTop(k) {
    const Tw = this.Tw, t0 = k * Tw, A = 1 + this.S.a2, sc = TOP_H / A, cols = X1 - X0, t = page.t, L = page.lang;
    const cyc = Math.max(this.S.f1, this.S.f2) * Tw / cols, n = Math.max(4, Math.ceil(cyc * 10));
    let up = [], dn = [], line = cyc < 0.25;
    for (let i = 0; i <= cols; i++) {
      const ta = t0 + i / cols * Tw;
      if (line) { up.push(`${X0 + i},${(TOP_Y - this.y(ta) * sc).toFixed(1)}`); continue; }
      let mn = 9, mx = -9;
      for (let j = 0; j < n; j++) { const v = this.y(ta + j / n * Tw / cols); if (v < mn) mn = v; if (v > mx) mx = v; }
      up.push(`${X0 + i},${(TOP_Y - mx * sc).toFixed(1)}`); dn.push(`${X0 + i},${(TOP_Y - mn * sc).toFixed(1)}`);
    }
    let s = `<rect x="0" y="0" width="1000" height="560" fill="#0f1218"/>` +
      `<text x="${X0}" y="22" fill="#a9a193" font-size="15">${Sim.esc(t.top)}</text>` +
      `<line x1="${X0}" y1="${TOP_Y}" x2="${X1}" y2="${TOP_Y}" stroke="#333" />` +
      `<line x1="${X0}" y1="${TOP_Y - TOP_H - 6}" x2="${X0}" y2="${TOP_Y + TOP_H + 6}" stroke="#555"/>`;
    s += line ? `<polyline points="${up.join(' ')}" fill="none" stroke="${CS}" stroke-width="1.6"/>`
              : `<polygon points="${up.join(' ')} ${dn.reverse().join(' ')}" fill="${CS}" fill-opacity=".85" stroke="${CS}" stroke-width=".6"/>`;
    if (this.beats) {
    const e = [], e2 = [];
    for (let i = 0; i <= cols; i += 2) { const ta = t0 + i / cols * Tw, v = this.env(ta) * sc; e.push(`${X0 + i},${(TOP_Y - v).toFixed(1)}`); e2.push(`${X0 + i},${(TOP_Y + v).toFixed(1)}`); }
    s += `<polyline points="${e.join(' ')}" fill="none" stroke="${CE}" stroke-width="2.2" stroke-dasharray="7 4"/><polyline points="${e2.join(' ')}" fill="none" stroke="${CE}" stroke-width="2.2" stroke-dasharray="7 4"/>`;
    }
    // time axis ticks
    const step = niceStep(Tw / 5);
    for (let v = Math.ceil(t0 / step) * step; v <= t0 + Tw + 1e-9; v += step) {
      const x = X0 + (v - t0) / Tw * cols;
      s += `<line x1="${x.toFixed(1)}" y1="${TOP_Y + TOP_H + 4}" x2="${x.toFixed(1)}" y2="${TOP_Y + TOP_H + 10}" stroke="#777"/>` +
           `<text x="${x.toFixed(1)}" y="${TOP_Y + TOP_H + 26}" fill="#8a8274" font-size="13" text-anchor="middle">${fl(v, step < 0.01 ? 3 : step < 0.1 ? 2 : 1, L)} s</text>`;
    }
    // beat period bracket between the first two loud points
    const TB = this.beats ? (this.fb > 0 ? 1 / this.fb : 0) : this.Trep;
    if (TB > 0 && TB <= Tw) {
      const Tb = TB, first = Math.ceil(t0 / Tb - 1e-9) * Tb;
      if (first + Tb <= t0 + Tw + 1e-9) {
        const xa = X0 + (first - t0) / Tw * cols, xb = X0 + (first + Tb - t0) / Tw * cols, yb = TOP_Y - TOP_H - 14;
        s += `<path d="M${xa.toFixed(1)},${yb + 6} V${yb} H${xb.toFixed(1)} V${yb + 6}" fill="none" stroke="${CE}" stroke-width="1.6"/>` +
             `<text x="${((xa + xb) / 2).toFixed(1)}" y="${yb - 6}" fill="${CE}" font-size="15" text-anchor="middle">${this.beats ? 'T_b = 1/f_b' : 'T'} = ${fl(Tb, Tb < 0.01 ? 4 : Tb < 0.1 ? 3 : 2, L)} s</text>`;
      }
    }
    $('top').innerHTML = s;
  }

  draw() {
    const Tw = this.Tw, k = Math.floor(this.t / Tw);
    if (k !== this.win) { this.win = k; this.drawTop(k); }
    const xh = X0 + (this.t - k * Tw) / Tw * (X1 - X0);
    $('head').setAttribute('x1', xh.toFixed(1)); $('head').setAttribute('x2', xh.toFixed(1));
    this.drawZoom();
  }

  // Lower graph: about four periods of wave 1, starting at a crest-free point of wave 1,
  // so wave 1 stands still and wave 2 slides past it at the beat rate.
  drawZoom() {
    const {f1, f2, a2} = this.S, t = page.t, cols = X1 - X0, far = !this.beats, Tr = this.Trep;
    // beats: four cycles of wave 1, aligned to wave 1 (wave 2 slides past it);
    // intervals: whole repetition periods when the ratio is simple, so the shape stands still.
    const span = far ? Math.min(14 / Math.max(f1, f2), Math.max(4 / Math.min(f1, f2), Tr || 0)) : 4 / f1;
    const unit = far && Tr ? Tr : 1 / f1, ts = Math.floor(this.t / unit) * unit;
    const p1 = [], p2 = [], ps = [];
    for (let i = 0; i <= cols; i += 2) {
      const ta = ts + i / cols * span, a = Math.sin(2 * Math.PI * f1 * ta), b = a2 * Math.sin(2 * Math.PI * f2 * ta), x = X0 + i;
      p1.push(`${x},${(Z_Y - 70 - a * Z_H * 0.55).toFixed(1)}`); p2.push(`${x},${(Z_Y - 70 - b * Z_H * 0.55).toFixed(1)}`);
      ps.push(`${x},${(Z_Y + 40 - (a + b) * Z_H * 0.55).toFixed(1)}`);
    }
    const ph = ((2 * Math.PI * (f2 - f1) * this.t) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI), c = Math.cos(ph);
    let msg = c > 0.85 ? t.inPhase : c < -0.85 ? t.outPhase : t.mid, col = c > 0.85 ? CE : c < -0.85 ? CH : '#a9a193';
    if (far) { const r = this.rat, k = r ? Math.max(r.p, r.q) + ':' + Math.min(r.p, r.q) : ''; msg = r ? `${r.p}:${r.q}` + (t.iv[k] ? ' · ' + t.iv[k] : '') : t.far; col = '#a9a193'; }
    const loud = this.env(this.t) / (1 + a2), bh = 150;
    let s = `<line x1="0" y1="298" x2="1000" y2="298" stroke="#2a2a2a"/>` +
      `<text x="${X0}" y="324" fill="#a9a193" font-size="15">${Sim.esc(t.zoom)}</text>` +
      `<text x="${X1}" y="324" fill="${col}" font-size="15" text-anchor="end">${Sim.esc(msg)}</text>` +
      `<line x1="${X0}" y1="${Z_Y - 70}" x2="${X1}" y2="${Z_Y - 70}" stroke="#333"/><line x1="${X0}" y1="${Z_Y + 40}" x2="${X1}" y2="${Z_Y + 40}" stroke="#333"/>` +
      `<polyline points="${p1.join(' ')}" fill="none" stroke="${C1}" stroke-width="2.2"/>` +
      `<polyline points="${p2.join(' ')}" fill="none" stroke="${C2}" stroke-width="2.2"/>` +
      `<polyline points="${ps.join(' ')}" fill="none" stroke="${CS}" stroke-width="2.6"/>` +
      `<text x="12" y="${Z_Y - 66}" fill="#a9a193" font-size="14">1 + 2</text><text x="12" y="${Z_Y + 44}" fill="${CS}" font-size="14">Σ</text>` +
      (far ? '' : `<rect x="${BAR_X}" y="${Z_Y + 88 - bh}" width="26" height="${bh}" fill="none" stroke="#555"/>` +
      `<rect x="${BAR_X}" y="${(Z_Y + 88 - bh * loud).toFixed(1)}" width="26" height="${(bh * loud).toFixed(1)}" fill="${col}"/>` +
      `<text x="${BAR_X + 13}" y="${Z_Y + 108}" fill="#a9a193" font-size="13" text-anchor="middle">${Sim.esc(t.loud)}</text>`);
    $('zoom').innerHTML = s;
  }

  /* ---------- texts and table ---------- */
  outputs() {
    const L = page.lang, d = v => v < 20 ? 1 : 0;
    $('o-f1').textContent = fl(this.S.f1, d(this.S.f1), L) + ' Hz';
    $('o-f2').textContent = fl(this.S.f2, d(this.S.f2), L) + ' Hz';
    $('o-df').textContent = (this.S.df > 0 ? '+' : this.S.df < 0 ? '−' : '') + fl(Math.abs(this.S.df), 1, L) + ' Hz';
    $('o-a2').textContent = Math.round(this.S.a2 * 100) + ' %';
    $('o-vol').textContent = Math.round(this.S.vol * 100) + ' %';
  }
  table() {
    this.outputs();
    const {f1, f2, a2} = this.S, t = page.t, L = page.lang, fb = this.fb, d = v => (v < 20 && v % 1) ? 1 : 0;
    const r = this.rat, rs = r ? `${r.p} : ${r.q}` : '≈ ' + fl(f2 / f1, 3, L), k = r ? Math.max(r.p, r.q) + ':' + Math.min(r.p, r.q) : '';
    const fmtT = T => fl(T, T < 0.01 ? 4 : T < 0.1 ? 3 : 2, L) + ' s';
    const rows = this.beats ? null : [
      [t.rows.f1, fl(f1, d(f1), L) + ' Hz'],
      [t.rows.f2, fl(f2, d(f2), L) + ' Hz'],
      [t.ratio, rs + (r && t.iv[k] ? ' · ' + t.iv[k] : '')],
      [t.rep, this.Trep ? fmtT(this.Trep) : t.noRep],
      [t.rows.win, fmtT(this.Tw)]
    ];
    if (rows) {
      $('calc').innerHTML = rows.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');
      const st = [t.stFar, r ? t.stRat(rs, t.iv[k], fmtT(this.Trep)) : t.stNoRat];
      if (Math.min(f1, f2) < 60) st.push(t.stLow);
      $('steps').innerHTML = st.map(x => `<div>${Sim.esc(x)}</div>`).join('');
      $('status').textContent = ''; $('status').className = 'status';
      return;
    }
    const rowsB = [
      [t.rows.f1, fl(f1, d(f1), L) + ' Hz'],
      [t.rows.f2, fl(f2, d(f2), L) + ' Hz'],
      [t.rows.fb, fb ? fl(fb, d(fb), L) + ' Hz' : '0 Hz · ' + t.none],
      [t.rows.Tb, fb ? fl(1 / fb, 1 / fb < 0.1 ? 3 : 2, L) + ' s' : t.inf],
      [t.rows.tone, fl((f1 + f2) / 2, (f1 + f2) / 2 < 20 ? 2 : 1, L) + ' Hz'],
      [t.rows.win, fl(this.Tw, this.Tw < 0.1 ? 3 : 2, L) + ' s']
    ];
    $('calc').innerHTML = rowsB.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');
    const st = [];
    st.push(L === 'el' ? `f_b = |f₁ − f₂| = |${fl(f1, d(f1), L)} − ${fl(f2, d(f2), L)}| = ${fl(fb, d(fb), L)} Hz.`
                       : `f_b = |f₁ − f₂| = |${fl(f1, d(f1), L)} − ${fl(f2, d(f2), L)}| = ${fl(fb, d(fb), L)} Hz.`);
    if (fb === 0) st.push(t.st0); else st.push(t.st1(fl(fb, d(fb), L)));
    if (fb > 12) st.push(t.stFast);
    if (fb > 0 && fb <= 3) st.push(t.stTune);
    if (f1 < 60) st.push(t.stLow);
    if (a2 < 0.999 && fb > 0) st.push(t.stAmp);
    $('steps').innerHTML = st.map(x => `<div>${Sim.esc(x)}</div>`).join('');
    $('status').textContent = ''; $('status').className = 'status';
  }
  texts() {
    const t = page.t;
    for (const k of ['h1', 'sub', 'title', 'hint', 'foot']) $(k).textContent = t[k];
    $('calc-h').textContent = t.calc; $('ctl-h').textContent = t.ctl;
    for (const k of ['f1', 'f2', 'df', 'a2', 'vol']) $('l-' + k).textContent = t[k];
    $('on1-l').textContent = t.on1; $('on2-l').textContent = t.on2;
    $('sound').textContent = this.soundOn ? t.soundOn : t.soundOff; $('sound').classList.toggle('on', this.soundOn); $('sound').setAttribute('aria-pressed', this.soundOn);
    $('play').textContent = this.running ? t.play : t.pause; $('play').setAttribute('aria-pressed', this.running);
    $('reset').textContent = t.reset; $('presets-l').textContent = t.presets;
    const P = {tune: {f1: 440, f2: 442, a2: 1}, fast: {f1: 440, f2: 450, a2: 1}, same: {f1: 440, f2: 440, a2: 1}, slow: {f1: 6, f2: 7, a2: 1}, half: {f1: 440, f2: 443, a2: 0.5},
      oct: {f1: 440, f2: 880, a2: 1}, fifth: {f1: 440, f2: 660, a2: 1}, fourth: {f1: 330, f2: 440, a2: 1}, third: {f1: 440, f2: 550, a2: 1}, off: {f1: 440, f2: 663, a2: 1}};
    $('presets').innerHTML = Object.keys(P).map(k => `<button class="btn alt" type="button" data-p="${k}">${Sim.esc(t.pre[k])}</button>`).join('');
    $('presets').querySelectorAll('button').forEach(b => b.onclick = () => this.set(P[b.dataset.p]));
    const col = [C1, C2, CS, CE, CH];
    $('legend').innerHTML = t.legend.map((x, i) => `<span><i style="background:${col[i]}"></i>${Sim.esc(x)}</span>`).join('');
    document.title = t.h1;
    this.win = -1;
    this.table();
  }
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }

/* ============================ "Solve it" questions ============================ */
const QUIZ = [
  // beat frequency
  () => {
    const f1 = pick([256, 320, 400, 440, 500, 512]), d = pick([1, 2, 3, 4, 5, 6, 8]), f2 = f1 + pick([-1, 1]) * d;
    return {
      q: Q(`Δύο πηγές εκπέμπουν ταυτόχρονα ήχους ${f1} Hz και ${f2} Hz. Η συχνότητα του διακροτήματος είναι:`, `Two sources sound together at ${f1} Hz and ${f2} Hz. The beat frequency is:`),
      o: [V(d, 'Hz', 0), V(f1 + f2, 'Hz', 0), V((f1 + f2) / 2, 'Hz', 1)], a: 0,
      x: Q(`f_b = |f₁ − f₂| = |${f1} − ${f2}| = ${d} Hz.`, `f_b = |f₁ − f₂| = |${f1} − ${f2}| = ${d} Hz.`),
      apply: () => app.set({f1, f2, a2: 1})
    };
  },
  // number of beats in some seconds
  () => {
    const f1 = pick([300, 400, 440, 500]), d = pick([2, 3, 4, 5]), s = pick([5, 10, 20]), f2 = f1 + d;
    return {
      q: Q(`Δύο διαπασών ${f1} Hz και ${f2} Hz ηχούν μαζί. Πόσα διακροτήματα ακούγονται σε ${s} s;`, `Two tuning forks of ${f1} Hz and ${f2} Hz sound together. How many beats are heard in ${s} s?`),
      o: [V(d * s, '', 0), V(d, '', 0), V(s / d, '', 1)], a: 0,
      x: Q(`f_b = ${d} Hz, άρα ${d} διακροτήματα το δευτερόλεπτο: ${d} × ${s} = ${d * s}.`, `f_b = ${d} Hz, so ${d} beats per second: ${d} × ${s} = ${d * s}.`),
      apply: () => app.set({f1, f2, a2: 1})
    };
  },
  // find the other frequency
  () => {
    const f1 = pick([256, 400, 440, 512]), d = pick([2, 3, 4, 5, 6]), hi = Math.random() < .5, f2 = hi ? f1 + d : f1 - d;
    return {
      q: Q(`Ένα διαπασών ${f1} Hz και μια χορδή δίνουν ${d} διακροτήματα το δευτερόλεπτο. Η χορδή έχει ${hi ? 'υψηλότερη' : 'χαμηλότερη'} συχνότητα. Η συχνότητά της είναι:`,
           `A ${f1} Hz tuning fork and a string give ${d} beats per second. The string has the ${hi ? 'higher' : 'lower'} frequency. Its frequency is:`),
      o: [V(f2, 'Hz', 0), V(hi ? f1 - d : f1 + d, 'Hz', 0), V(f1 * d, 'Hz', 0)], a: 0,
      x: Q(`|f₁ − f₂| = ${d} Hz και η χορδή είναι ${hi ? 'ψηλότερα' : 'χαμηλότερα'}: f = ${f1} ${hi ? '+' : '−'} ${d} = ${f2} Hz.`, `|f₁ − f₂| = ${d} Hz and the string is ${hi ? 'higher' : 'lower'}: f = ${f1} ${hi ? '+' : '−'} ${d} = ${f2} Hz.`),
      apply: () => app.set({f1, f2, a2: 1})
    };
  },
  // beat period
  () => {
    const f1 = pick([400, 440, 500]), d = pick([2, 4, 5, 10]), f2 = f1 + d;
    return {
      q: Q(`Ήχοι ${f1} Hz και ${f2} Hz ηχούν μαζί. Κάθε πόσο φτάνει ο ήχος στη μέγιστη ένταση;`, `Sounds of ${f1} Hz and ${f2} Hz play together. How often does the sound reach its loudest?`),
      o: [V(1 / d, 's', 2), V(d, 's', 0), V(1 / f1, 's', 4)], a: 0,
      x: Q(`f_b = ${d} Hz, άρα T_b = 1/f_b = ${fl(1 / d, 2, 'el')} s.`, `f_b = ${d} Hz, so T_b = 1/f_b = ${fl(1 / d, 2, 'en')} s.`),
      apply: () => app.set({f1, f2, a2: 1})
    };
  },
  // tuning
  () => ({
    q: Q('Κουρδίζουμε μια χορδή δίπλα σε ένα διαπασών. Καθώς πλησιάζουμε τη σωστή συχνότητα, τα διακροτήματα:', 'A string is tuned next to a tuning fork. As it gets close to the right frequency, the beats:'),
    o: [Q('αραιώνουν και τελικά σταματούν', 'slow down and finally stop'), Q('πυκνώνουν', 'get faster'), Q('δεν αλλάζουν', 'do not change')], a: 0,
    x: Q('f_b = |f₁ − f₂|: όσο μικραίνει η διαφορά, τόσο λιγότερα διακροτήματα. Στην ίδια συχνότητα f_b = 0.', 'f_b = |f₁ − f₂|: the smaller the difference, the fewer the beats. At the same frequency f_b = 0.'),
    apply: () => app.set({f1: 440, f2: 441, a2: 1})
  }),
  // loud moment = in phase
  () => ({
    q: Q('Τη στιγμή που ο ήχος ενός διακροτήματος είναι πιο δυνατός, τα δύο κύματα βρίσκονται:', 'At the moment the sound of a beat is loudest, the two waves are:'),
    o: [Q('σε φάση (ενισχυτική συμβολή)', 'in phase (constructive interference)'), Q('σε αντίθετη φάση (ακυρωτική συμβολή)', 'in opposite phase (destructive interference)'), Q('με διαφορά φάσης 90°', 'a quarter of a cycle apart')], a: 0,
    x: Q('Όταν οι κορυφές συμπίπτουν τα πλάτη προστίθενται. Όταν η κορυφή του ενός πέφτει στην κοιλάδα του άλλου, ακυρώνονται.', 'When the crests line up the amplitudes add. When the crest of one meets the trough of the other, they cancel.'),
    apply: () => app.set({f1: 6, f2: 7, a2: 1})
  }),
  // equal frequencies
  () => ({
    q: Q('Δύο πηγές εκπέμπουν ακριβώς την ίδια συχνότητα, 500 Hz. Ο ήχος που ακούμε:', 'Two sources emit exactly the same frequency, 500 Hz. The sound we hear:'),
    o: [Q('έχει σταθερή ένταση, χωρίς διακροτήματα', 'has a steady loudness, with no beats'), Q('δίνει 500 διακροτήματα το δευτερόλεπτο', 'gives 500 beats per second'), Q('δίνει 1000 διακροτήματα το δευτερόλεπτο', 'gives 1000 beats per second')], a: 0,
    x: Q('f_b = |500 − 500| = 0 Hz: η φάση τους δεν αλλάζει, άρα ούτε η ένταση.', 'f_b = |500 − 500| = 0 Hz: their phase never changes, so neither does the loudness.'),
    apply: () => app.set({f1: 500, f2: 500, a2: 1})
  })
];

const app = new BeatsPage();
</script>
