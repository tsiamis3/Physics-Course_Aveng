<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson · Physics for Aircraft Engineers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e6ebef;--panel:#f7f9fa;--ink:#14212b;--mute:#5b6b78;--line:#c3cdd5;--blue:#1f4e79;--amber:#e8a317;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:6px solid var(--amber)}
header h1{margin:0;font:700 clamp(26px,5vw,40px)/1.1 "Barlow Condensed",Impact,sans-serif}
header p{margin:6px 0 0;color:#b9c6d0}
header a{color:#fff;text-underline-offset:3px}
main{max-width:900px;margin:20px auto;padding:0 16px}
section,.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 8px}
ul{margin:0;padding-left:20px}
li{margin-bottom:4px}
code{font-family:ui-monospace,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font-size:14px;color:inherit;text-decoration:none}
.btn{display:inline-block;border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600;background:var(--blue);color:#fff;text-decoration:none}
.meta{font-size:14px;color:var(--mute);margin-bottom:4px}
.q{font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.opt.ok{background:#e3f3ea;border-color:var(--ok)}
.opt.bad{background:#fbe6e4;border-color:var(--bad)}
.expl{margin:8px 0 0;padding:8px 10px;border-left:4px solid var(--amber);background:#fff7e0}
.note{color:var(--mute);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:inherit}
.board{list-style:none;margin:0 0 8px;padding:0}
.board li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.board .rk{width:1.6em;color:var(--mute)}.board .nm{flex:1}.board .pt small{color:var(--mute)}.board .me{font-weight:700}
#score{font-size:22px;font-weight:700}
</style>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<header>
  <h1 id="title">Lesson</h1>
  <p id="sub"><a href="index.html">← Home</a> · <a href="bank.html">Question bank</a></p>
</header>
<main id="main"></main>
<script src="questions.js"></script>
<script src="lessons.js"></script>
<script src="scoreboard.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Board.esc;

// One lesson page: the review text, and a quiz made only of the questions that belong to this lesson.
class LessonPage {
  constructor(lesson, pool) {
    this.L = lesson;
    this.qs = pool.filter(q => q.lesson === lesson.id || (lesson.questionIds || []).includes(q.id));   // tagged with --lesson, or listed in the .md file
    this.answered = {};
  }

  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  prettyDate(d) { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? d : t.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}); }

  renderReview() {
    const L = this.L;
    document.title = L.title + ' · Physics for Aircraft Engineers';
    $('title').textContent = L.title;
    $('sub').innerHTML = `${esc(this.prettyDate(L.date))} · <a href="index.html">← Home</a> · <a href="bank.html">Question bank</a>`;
    const topics = (L.topics || []).map(t => `<a class="chip" href="bank.html#${new URLSearchParams({topic: t})}">${esc(t)}</a>`).join('');
    const list = (title, items, fmt) => items && items.length ? `<section><h2>${title}</h2><ul>${items.map(i => `<li>${fmt(i)}</li>`).join('')}</ul></section>` : '';
    $('main').innerHTML =
      `<section><h2>Lesson review</h2>${(L.summary || []).map(p => `<p>${esc(p)}</p>`).join('') || '<p class="note">No review text yet.</p>'}` +
      (topics ? `<div class="chips">${topics}</div><p class="note">Topic chips open the question bank filtered by that topic.</p>` : '') + `</section>` +
      list('Key points', L.keyPoints, esc) +
      list('Formulas', L.formulas, f => `<code>${esc(f)}</code>`) +
      list('Links', L.links, l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`) +
      `<section id="quizBox"><h2>Questions for this lesson</h2><div id="quiz"></div><div id="result"></div></section>`;
    this.renderQuiz();
  }

  renderQuiz() {
    this.answered = {};
    $('result').innerHTML = '';
    if (!this.qs.length) { $('quiz').innerHTML = '<p class="note">No questions for this lesson yet.</p>'; return; }
    $('quiz').innerHTML = '';
    this.shuffle(this.qs).forEach((q, n) => {
      const opts = this.shuffle(q.options.map((text, i) => ({text, correct: i === q.answer})));
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<div class="meta">${n + 1} of ${this.qs.length} · ${esc(q.difficulty || '')}${q.type ? ' · ' + esc(q.type) : ''}</div>
        <p class="q">${esc(q.question)}</p>
        ${opts.map((o, k) => `<button class="opt" type="button">${'ABCD'[k]}) ${esc(o.text)}</button>`).join('')}
        <p class="expl" hidden>${esc(q.explanation || '')}</p>`;
      card.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => this.answer(q, opts, k, card));
      $('quiz').appendChild(card);
    });
  }

  answer(q, opts, i, card) {
    if (this.answered[q.id] !== undefined) return;
    this.answered[q.id] = opts[i].correct;
    card.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (opts[k].correct) b.classList.add('ok'); else if (k === i) b.classList.add('bad'); });
    card.querySelector('.expl').hidden = false;
    if (Object.keys(this.answered).length === this.qs.length) this.finish();
  }

  async finish() {
    const correct = Object.values(this.answered).filter(Boolean).length, total = this.qs.length;
    const box = $('result');
    box.innerHTML = `<div class="card"><p id="score">Score: ${correct} / ${total} (${correct * 10} pts)</p><div id="nickBox"></div><div id="top"></div>` +
                    `<p><button class="btn" id="again" type="button">Try again</button></p></div>`;
    $('again').onclick = () => { this.renderQuiz(); $('quizBox').scrollIntoView(); };
    if (Board.valid(board.nick)) { await board.submit(this.L.id, correct, total); this.showTop(); }
    else {
      await board.submit(this.L.id, correct, total);             // kept on this device
      $('nickBox').innerHTML = `<p>Choose a nickname to appear on the scoreboard (2 to 16 letters or digits):</p>` +
        `<div class="row"><input id="nick" maxlength="16" placeholder="Nickname"><button class="btn" id="saveNick" type="button">Save</button></div><p class="note" id="nickMsg"></p>`;
      $('saveNick').onclick = async () => {
        const v = $('nick').value.trim();
        if (!Board.valid(v)) { $('nickMsg').textContent = 'Use 2 to 16 letters, digits, spaces, - or _.'; return; }
        board.nick = v; $('nickBox').innerHTML = '';
        await board.submit(this.L.id, correct, total); this.showTop();
      };
      this.showTop();
    }
    box.scrollIntoView({block: 'nearest'});
  }

  async showTop() { $('top').innerHTML = '<h2>Scoreboard for this lesson</h2>' + board.table(await board.top(this.L.id)); }
}

const lessons = window.LESSONS || [], pool = window.QUESTIONS || [];
const wanted = new URLSearchParams(location.search).get('d');
const found = lessons.find(l => l.id === wanted);
if (found) new LessonPage(found, pool).renderReview();
else $('main').innerHTML = '<section><p>Lesson not found. <a href="index.html">Back to the home page</a>.</p></section>';
</script>
</body>
</html>
